.ch-game .ch-bar.sel { outline: 2px solid var(--text); outline-offset: 1px; z-index: 3; }
.ch-game .ch-bar:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; z-index: 4; }
.bl { display: none; pointer-events: none; }
.mode-pm .bl-pm, .mode-pts .bl-pt { display: inline; }
.mode-pm .ch-bar.pm-p2, .sp-pm.pm-p2, .lg-bin.pm-p2 { background-color: var(--more); color: var(--ground); }
.mode-pm .ch-bar.pm-p1, .sp-pm.pm-p1, .lg-bin.pm-p1 { background-color: var(--pm-more-mild); }
.mode-pm .ch-bar.pm-0, .sp-pm.pm-0, .lg-bin.pm-0 { background-color: var(--period-line); }
.mode-pm .ch-bar.pm-n1, .sp-pm.pm-n1, .lg-bin.pm-n1 { background-color: var(--pm-less-mild); }
.mode-pm .ch-bar.pm-n2, .sp-pm.pm-n2, .lg-bin.pm-n2 { background-color: var(--less); color: var(--ground); }
.mode-pts .ch-bar.pt-0, .lg-bin.pt-0 { background-color: var(--pts-0); }
.mode-pts .ch-bar.pt-1, .lg-bin.pt-1 { background-color: var(--pts-1); }
.mode-pts .ch-bar.pt-2, .lg-bin.pt-2 { background-color: var(--pts-2); }
.mode-pts .ch-bar.pt-3, .lg-bin.pt-3 { background-color: var(--pts-3); color: var(--ground); }
.ch-game .ch-over { right: calc(var(--mw) + var(--pw) + 2 * var(--cg)); }

/* Game picker, title row and the bar color switch (§4.3 items 1-2, V11) */
.gp { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.gp-lab { margin-right: 4px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; color: var(--text-3); }
.gp-chip, .gp-older {
  display: flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 10px; border: 1px solid var(--line-strong);
  border-radius: 4px; color: var(--text-2);
}
.gp-chip { font-family: var(--mono); font-size: 12px; }
.gp-older { padding: 0 12px; font-size: 13px; }
.gp-chip:hover, .gp-older:hover { border-color: var(--text-3); }
.gp-chip[aria-current="page"] { background: var(--text); color: var(--ground); border-color: var(--text); }
.gp-res { font-size: 11px; font-weight: 700; color: var(--text-3); }
.gp-res.w { color: var(--text); }
.gp-chip[aria-current="page"] .gp-res { color: var(--ground); }
.gp-phone { display: flex; align-items: center; gap: 8px; }
.gp-step {
  flex: none; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px;
  border: 1px solid var(--line-strong); border-radius: 4px; color: var(--text-2);
}
.gp-step.off { border-color: var(--line-soft); color: var(--text-off); }
.gp-mid { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; text-align: center; line-height: 1.3; }
.gp-title { font-size: 17px; font-weight: 650; }
.gp-line { font-family: var(--mono); font-size: 12px; color: var(--text-2); }
.gp-ok { color: var(--ok); }
.gm-switch { display: flex; align-items: center; gap: 8px; }
.gm-lab { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; color: var(--text-3); }
.gm-btns { display: flex; border: 1px solid var(--line-strong); border-radius: 4px; overflow: hidden; }
.gm-btns button { min-height: 40px; padding: 0 14px; border: 0; background: transparent; color: var(--text-2); font: inherit; font-size: 13px; cursor: pointer; }
.gm-btns button:hover { background: var(--row-hover); }
.gm-btns button + button { border-left: 1px solid var(--line-strong); }
.gm-btns button[aria-pressed="true"] { background: var(--text); color: var(--ground); font-weight: 600; }

/* The stint popover (C4-C7, §4.3 item 4); a bottom sheet on the phone (V12) */
.ch-pop.sp { width: 380px; gap: 10px; }
.sp-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sp-who { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
.sp-name { font-size: 14px; font-weight: 650; }
.sp-when { font-family: var(--mono); font-size: 12px; color: var(--text-2); }
.sp-pm { flex: none; font-family: var(--mono); font-size: 18px; font-weight: 700; padding: 2px 10px; border-radius: 3px; color: var(--text); }
.sp-boxes { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
.sp-box {
  display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 0; border-radius: 3px;
  font-family: var(--mono); background: var(--header); border: 1px solid var(--line);
}
.sp-box.hi { background: var(--heat-2); border-color: var(--heat-4); }
.sp-v { font-size: 15px; font-weight: 650; }
.sp-k { font-size: 9.5px; letter-spacing: 0.08em; color: var(--text-3); }
.sp-paces { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-family: var(--mono); font-size: 12px; color: var(--text-2); }
.sp-pace { padding: 1px 6px; border-radius: 3px; color: var(--text); background: var(--chip); }
.sp-left { display: flex; flex-direction: column; gap: 4px; padding: 8px 10px; background: var(--ground); border: 1px solid var(--line); border-radius: 4px; font-size: 12.5px; }
.sp-lhead { display: flex; align-items: center; gap: 8px; }
.sp-llab { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; color: var(--text-3); }
.sp-tag { font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; padding: 1px 7px; border-radius: 3px; }
.sp-tag.end { color: var(--ground); background: var(--tag-end); }
.sp-tag.quiet { color: var(--text-2); border: 1px solid var(--line-heavy); }
.sp-tag.loud { color: var(--ground); background: var(--tc); }
.sp-why, .sp-ev { color: var(--text-2); }
.sp-ev { font-family: var(--mono); font-size: 12px; }
.sp-none { margin: 0; font-size: 12.5px; color: var(--text-3); }
.sp-close { width: 100%; min-height: 44px; border: 1px solid var(--line-heavy); border-radius: 4px; background: transparent; color: var(--text); font: inherit; cursor: pointer; }

/* Legend (§4.3 item 5) */
.lg-bin {
  display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 14px; padding: 0 3px;
  border-radius: 2px; font-family: var(--mono); font-size: 9.5px; font-weight: 700; color: var(--text);
}
.lg-plain { background: var(--on-floor); }
.lg-size {
  display: inline-flex; align-items: center; padding: 0 4px; height: 14px; border-radius: 2px; font-family: var(--mono); font-size: 9.5px;
  font-weight: 700; color: var(--ground); background: linear-gradient(90deg, var(--size-1), var(--size-5));
}
.lg-pace { width: 28px; height: 12px; border-radius: 1px; background: linear-gradient(90deg, var(--pace-1), var(--pace-5)); }

@media (max-width: 599px) {
  .ch-game, .ch-game.ch-issue { --nw: 74px; --mw: 30px; --pw: 0px; --cg: 6px; --rowh: 34px; --barh: 32px; --pl: 0px; --bi: 7px; }
  .ch-game.ch-issue { --mw: 64px; }
  .ch-game .ch-g { grid-template-columns: var(--nw) minmax(0, 1fr) var(--mw); column-gap: var(--cg); }
  .ch-game .ch-g > * { grid-row: 1; }
  .ch-game .ch-g > .ch-n { grid-column: 1; }
  .ch-game .ch-g > .ch-t { grid-column: 2; }
  .ch-game .ch-g > .ch-m { grid-column: 3; }
  .ch-game .ch-p { display: none; }
  .ch-game .ch-row { min-height: var(--rowh); padding-top: 0; }
  .ch-game .ch-n { gap: 4px; }
  .ch-game .ch-badge { width: 14px; height: 14px; font-size: 9px; }
  .ch-game .ch-name { font-size: 12px; }
  .ch-game .ch-row > .ch-m { font-size: 12px; }
  .ch-game .ch-track { background-clip: content-box; padding: var(--bi) 0; box-sizing: border-box; }
  .ch-game .ch-bar.ch-endcap::after { width: 2px; }
  .ch-game .ch-over { left: calc(var(--nw) + var(--cg)); right: calc(var(--mw) + var(--cg)); }
  .ch-strip { min-height: 22px; }
  .ch-strip .ch-n { font-size: 9.5px; letter-spacing: 0.06em; }
  .ch-strip .ch-m { display: none; }
  .ch-stripbox { height: 18px; }
  .ch-seg { font-size: 10px; }
  .ch-seg.pace-1, .ch-seg.pace-2, .ch-seg.pace-3, .ch-seg.pace-4, .ch-seg.pace-5 { font-size: 9.5px; }
  .ch-seam { padding: 6px 0; margin: 4px 0; }
  .ch-game .ch-seam .ch-n { flex-direction: column; align-items: flex-start; gap: 0; }
  .ch-seam .ch-mlab, .ch-seam .ch-mkey { font-size: 9.5px; letter-spacing: 0.06em; color: var(--text-2); font-family: var(--mono); }
  .ch-seam .ch-mbox { height: 44px; }
  .ch-seam .ch-final { font-size: 11px; }
  .ch-pop.sp { width: auto; }
  .mode-pm .bl-pm, .mode-pts .bl-pt { display: none; } /* §3 row 17: phone bars print nothing */
  .gm-switch { width: 100%; }
  .gm-btns { flex: 1 1 auto; }
  .gm-btns button { flex: 1 1 0; min-height: 44px; padding: 0 6px; }
}

/* Stint details under each team's own rows, never on a row (Steffen, Nov 5 2026: was a 340 px panel
   to the right, which squeezed the chart). A short strip across the card's full width; its parts sit in
   one row when they fit and wrap to the next line when they don't, so nothing spills (review, Nov 5).
   On the phone the details are a sheet at the bottom of the screen (06a V12). */
.ch-main { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ch-side-empty { margin: 0; padding: 10px 14px; font-size: 12.5px; color: var(--text-3); border: 1px dashed var(--line-strong); border-radius: 6px; }
.ch-pop:not([hidden]) + .ch-side-empty { display: none; }
@media (min-width: 600px) {
  .ch-game .ch-side { display: flex; flex-direction: column; margin: 6px 0 10px; }
  .ch-game .ch-pop, .ch-game .ch-pop.sp {
    position: static; width: auto; max-width: none; box-shadow: none; z-index: auto;
    flex-direction: row; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 6px 6px 6px 12px;
  }
  .ch-game .ch-pop-top, .ch-game .sp-top { display: contents; }
  .ch-game .ch-pop-x { width: 32px; height: 32px; order: 9; margin-left: auto; }
  /* stint: who, +/-, stat boxes, pace, why he left, close */
  .ch-game .sp-who { flex: 0 1 auto; order: 1; }
  .ch-game .sp-when { white-space: nowrap; }
  .ch-game .sp-pm { order: 2; font-size: 16px; }
  .ch-game .sp-boxes { order: 3; grid-template-columns: repeat(6, 44px); }
  .ch-game .sp-none { order: 3; flex: 1 1 260px; }
  .ch-game .sp-box { padding: 2px 0; }
  .ch-game .sp-v { font-size: 14px; }
  .ch-game .sp-paces { order: 4; flex-direction: column; align-items: flex-start; gap: 3px; }
  .ch-game .sp-left { order: 5; flex: 1 1 300px; min-width: 0; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 5px 10px; }
  /* gap: the tag, when he sat, the evidence, close */
  .ch-game .ch-pop:not(.sp) .ch-pop-tag { order: 1; }
  .ch-game .ch-pop:not(.sp) .ch-pop-when { order: 2; flex: 0 1 auto; }
  .ch-game .ch-pop:not(.sp) .ch-pop-ev { order: 3; flex: 1 1 300px; min-width: 0; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 2px 10px; padding: 5px 10px; }
}
@media (max-width: 599px) {
  .ch-side-empty { display: none; }
}

/* A clicked stint lights its time window (change 6): bars outside it get a dark veil; a bar partly
   inside it is veiled too, with its in-window piece drawn again on top in the bar's own color */
.ch-game .ch-bar.hl-out::before, .ch-game .ch-bar.hl-part::before {
  content: ""; position: absolute; left: 0; right: 0; top: var(--bi); bottom: var(--bi); background: rgba(11, 14, 19, 0.72); pointer-events: none;
}
/* a bar's printed number stays on top of the veil and the lit piece (V3: color carries its number) */
.ch-game .bl { position: relative; z-index: 2; }
.ch-game .ch-bar.hl-out .bl { opacity: 0.55; }
.ch-hlseg { position: absolute; top: var(--bi); bottom: var(--bi); z-index: 1; background-color: inherit; pointer-events: none; }
.ch-game.hl-on .ch-chip, .ch-game.hl-on .ch-tick, .ch-game.hl-on .ch-cap { opacity: 0.35; }
.cz-legend .ckey-lab { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; color: var(--text-3); }

/* Color keys above each colored table or chart, and the "How to read this" page (Steffen, Nov 5 2026).
   A swatch (.sw) is drawn from the same color tokens as the thing it explains (base.css). */
.ckey {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin: 0;
  font-size: 11.5px; color: var(--text-2); line-height: 1.3;
}
.ckey-lab { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; color: var(--text-3); }
.ckey-i { display: inline-flex; align-items: center; gap: 6px; }
.ckey .chip-issue, .ckey .chip-small { font-size: 9.5px; }

.sw {
  display: inline-flex; align-items: center; justify-content: center; flex: none; position: relative;
  min-width: 18px; height: 14px; padding: 0 4px; box-sizing: border-box; border-radius: 2px;
  font-family: var(--mono); font-size: 10px; font-weight: 600; color: var(--text); background: var(--surface-2);
}
/* minutes heat (06a §3 row 1) and the cell marks (V6) */
.sw.h1 { background: var(--heat-1); color: var(--heat-dim-text); }
.sw.h2 { background: var(--heat-2); color: var(--heat-dim-text); }
.sw.h3 { background: var(--heat-3); }
.sw.h4 { background: var(--heat-4); }
.sw.h5 { background: var(--heat-5); }
.sw.start::before { content: ""; position: absolute; left: 3px; right: 3px; top: 1px; height: 2px; background: var(--text); border-radius: 1px; }
.sw.role { outline: 1px dashed var(--flag-new); outline-offset: 1px; }
.sw.ring { box-shadow: inset 0 0 0 1.5px var(--c); color: var(--text); }
.sw.out { color: var(--flag-absent); background: color-mix(in srgb, var(--flag-absent) 12%, transparent); border: 1px solid color-mix(in srgb, var(--flag-absent) 40%, transparent); }
.sw.dnp { background: none; color: var(--text-off); }
.sw.gi { background: var(--issue-bg); color: var(--issue); }
.sw.tint { color: var(--c); background: color-mix(in srgb, var(--c) 10%, transparent); border: 1px solid color-mix(in srgb, var(--c) 30%, transparent); }
/* more / less / no real change (V2) */
.sw.more { background: var(--more); }
.sw.less { background: var(--less); }
.sw.gray { background: none; border: 1px solid var(--line-strong); color: var(--text-3); }
.sw.trend.gray { border: 0; }
.sw.trend.tint { color: var(--more); background: color-mix(in srgb, var(--more) 12%, transparent); border: 1px solid color-mix(in srgb, var(--more) 35%, transparent); }
.sw.trend.solid { color: var(--ground); background: var(--more); }
.sw.cb.more { color: var(--more); background: color-mix(in srgb, var(--more) 12%, transparent); }
.sw.cb.less { color: var(--less); background: color-mix(in srgb, var(--less) 12%, transparent); }
.sw.share { width: 28px; height: 10px; }
.sw.share.gray { background: var(--on-floor); border: 0; }
.sw.share.dash { background: none; border: 1.5px dashed var(--on-floor); }
.sw.foul { width: 28px; height: 8px; }
.sw.f1 { background: var(--foul-1); }
.sw.f2 { background: var(--foul-2); }
.sw.f3 { background: var(--foul-3); }
.sw.tick { min-width: 2px; width: 2px; height: 16px; padding: 0; background: var(--text); }
.sw.tick.cause { background: var(--tag-none); }
/* slate cards (06a §3 rows 8, 9, 12) */
.sw.card-0 { background: var(--card-0); border: 1px solid var(--line-strong); }
.sw.card-1 { background: var(--card-1); }
.sw.card-2 { background: var(--card-2); }
.sw.card-3 { background: var(--card-3); }
.sw.card-4 { background: var(--card-4); }
.sw.pace-1 { background: var(--pace-1); }
.sw.pace-2 { background: var(--pace-2); }
.sw.pace-3 { background: var(--pace-3); }
.sw.pace-4 { background: var(--pace-4); }
.sw.pace-5 { background: var(--pace-5); color: var(--ground); }
.sw.size-share-0 { background: var(--size-share-0); border: 1px solid var(--line-strong); }
.sw.size-1 { background: var(--size-1); }
.sw.size-2 { background: var(--size-2); }
.sw.size-3 { background: var(--size-3); }
.sw.size-4 { background: var(--size-4); color: var(--ground); }
.sw.sw-dial { width: 40px; height: 6px; padding: 0; background: var(--header); border: 1px solid var(--line); border-radius: 3px; }
.sw.sw-dial::after { content: ""; position: absolute; left: 60%; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--pace-dot); }
.sw.sw-gap { background: var(--pace-accent); color: var(--ground); }
/* the matchup page's side-by-side bars (matchup.css .tbar) */
.sw.tpace { width: 28px; height: 10px; background: var(--pace-3); }
.sw.tpace.edge { background: var(--pace-5); }
.sw.tsize { width: 28px; height: 10px; background: var(--size-2); }
.sw.tsize.edge { background: var(--size-4); }
/* the game chart (06a §3 rows 11, 13, 14; 04a §6) */
.sw.pm-p2 { background: var(--more); color: var(--ground); }
.sw.pm-p1 { background: var(--pm-more-mild); }
.sw.pm-0 { background: var(--period-line); }
.sw.pm-n1 { background: var(--pm-less-mild); }
.sw.pm-n2 { background: var(--less); color: var(--ground); }
.sw.pt-0 { background: var(--pts-0); }
.sw.pt-1 { background: var(--pts-1); }
.sw.pt-2 { background: var(--pts-2); }
.sw.pt-3 { background: var(--pts-3); color: var(--ground); }
.sw.plain { width: 28px; background: var(--on-floor); }
.sw.badge { min-width: 16px; height: 16px; padding: 0; border-radius: 3px; background: var(--starter-badge); color: var(--ground); }
.sw.endcap { width: 22px; background: var(--on-floor); border-right: 3px solid var(--tag-end); }
.sw.chip { background: var(--tc); color: var(--ground); }
.sw.size { background: var(--chip); }
.sw.sz-4 { background: var(--size-4); color: var(--ground); }
.sw.sz-5 { background: var(--size-5); color: var(--ground); }
.sw.seam { width: 28px; height: 16px; border: 1px solid var(--line-strong); background: linear-gradient(color-mix(in srgb, var(--more) 25%, transparent) 50%, color-mix(in srgb, var(--less) 25%, transparent) 50%); }
.sw.ot { width: 22px; background: var(--ot-band); border: 1px solid var(--period-line); }
.sw.band { width: 22px; border-left: 1px solid var(--issue); border-right: 1px solid var(--issue); background: repeating-linear-gradient(135deg, var(--issue-line) 0 3px, transparent 3px 6px); }

/* the How to read this page */
.guide { display: flex; flex-direction: column; gap: 28px; max-width: 920px; }
.guide h1 { margin: 0; font-size: 28px; font-weight: 650; }
.guide-lede { margin: 6px 0 0; color: var(--text-2); }
.gsec { display: flex; flex-direction: column; gap: 10px; }
.gsec h2 { margin: 0; font-size: 18px; font-weight: 650; }
.gsec-intro { margin: 0; color: var(--text-2); }
.gitems { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; margin: 0; padding: 0; list-style: none;
  border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.gitem { display: grid; grid-template-columns: 118px minmax(0, 220px) minmax(0, 1fr); gap: 4px 14px; align-items: center;
  padding: 9px 14px; border-bottom: 1px solid var(--line-soft); }
.gitem:last-child { border-bottom: 0; }
.gitem-sw { display: flex; align-items: center; }
.gitem-label { font-weight: 600; }
.gitem-says { color: var(--text-2); }
@media (max-width: 599px) {
  .gitem { grid-template-columns: minmax(0, 1fr); gap: 4px; padding: 10px 12px; }
  .gitem-sw:empty { display: none; }
}

</style>

    }
    const n = DATA.chart_rules.games; // only the newest n games have a chart (settings.CHART_GAMES)
    const list = el("div", { class: "rc" }, t.games.slice(0, n).map((g, i) => {
      const bodyId = "rc-" + g.game_id;
      const open = i === 0; // the latest game starts open; opening one closes nothing else
      const body = el("div", { class: "rc-body", id: bodyId, "data-game": g.game_id, hidden: !open });
      if (open) fill(body);
      return el("div", { class: "rc-game" },
        el("button", { type: "button", class: "rc-btn", "aria-expanded": String(open), "aria-controls": bodyId },
          el("span", { class: "rc-arrow", "aria-hidden": "true" }, open ? "▾" : "▸"),
          el("span", { class: "rc-vs" }, g.vs),
          el("span", { class: "rc-date" }, g.date),
          el("span", { class: "rc-res" }, g.result),
          g.data_issue ? CBB.issueChip() : null),
        body);
    }));
    list.addEventListener("click", (e) => {
      const b = e.target.closest(".rc-btn");
      if (!b) return;
      const open = b.getAttribute("aria-expanded") !== "true";
      b.setAttribute("aria-expanded", String(open));
      b.querySelector(".rc-arrow").textContent = open ? "▾" : "▸";
      const body = document.getElementById(b.getAttribute("aria-controls"));
      body.hidden = !open;
      if (open) fill(body);
    });
    return el("section", { class: "tsec", "aria-labelledby": "rc-h" },
      el("h2", { id: "rc-h" }, "Rotation charts", el("span", { class: "h-sub only-wide" }, " · from play-by-play · newest first")),
      list,
      t.games.length > n ? el("p", { class: "rc-more" }, "Charts cover the " + n + " most recent games. The " +
        (t.games.length - n) + " older game" + (t.games.length - n === 1 ? " is" : "s are") + " in the minutes table above.") : null);
  }

  function draw(t) {
    shown = t.team;
    picker.value = t.team;
    root.textContent = "";
    root.append(header(t));
    if (t.early_season) {
      root.append(el("div", { class: "tempty" },
        el("p", { class: "tempty-head" }, t.team + " has no games yet this season"),
        el("p", null, "Minutes, charts and flags appear after its first game.")));
      return;
    }
    root.append(minutes(t), charts(t));
  }

  // Links into this tab: #teams?team=Kansas+State. The plain tab link keeps the team on screen.
  CBB.onTab.teams = function (params) {
    const want = TEAMS.find((t) => t.team === params.get("team"))
      || TEAMS.find((t) => t.team === shown) || TEAMS[0];
    if (!want) {
      root.textContent = "";
      root.append(el("p", { class: "not-built" }, "No teams on this slate."));
      return;
    }
    if (want.team !== shown) draw(want);
    return want.team; // the breadcrumb names this team's matchup (core.js)
  };
});

/* Matchup page (specs/06a-redesign-design.md section 4.2, V5-V8, V14; mockups Matchup.dc.html and
   PhoneMatchup.dc.html). S2: title, side-by-side strip, both teams' minutes grids (Minutes view)
   and the player-out lines. S3: the Minutes | Situations switch (V5) and the Situations view, foul
   trouble (D), reacting to the opponent (E) and its evidence lists (V17).
   Words and numbers come from Python (DATA.matchups, DATA.teams); the heat steps come from
   DATA.matchup_rules and every Situations / share color is worked out in Python (06a M5): this file
   never types a cut point in. Laptop shows both teams side by
   side; below 600 px one team at a time with a sticky team switch (V14). */
CBB.render(function () {
  "use strict";
  const { DATA, KINDS, el, link } = CBB;
  const M = DATA.matchups || [];
  const R = DATA.matchup_rules;
  const root = document.getElementById("tab-matchup");
  const TEAMS = Object.fromEntries(DATA.teams.map((t) => [t.team, t]));
  const KIND = Object.fromEntries(KINDS.map((k) => [k.key, k]));
  const SAYS = { absent: "absent", spike: "minutes spike", drop: "minutes drop", "new starter": "new starter" };
  // How many cut points a value has reached (0 = under the first)
  const step = (v, cuts) => cuts.filter((c) => v >= c).length;
  let shown = null;
  let view = "min"; // V5: "min" | "sit", the same for both teams' tables

  // ---------- title row ----------
  function title(m) {
    return el("section", { class: "mhead" },
      el("div", { class: "mhead-text" },
        el("h1", null, m.title),
        el("p", { class: "msub only-wide" }, m.sub.join(" · ")),
        el("p", { class: "msub only-narrow" }, m.sub_short)),
      viewSwitch("only-wide"));
  }

  // ---------- Minutes | Situations (V5): one switch, both tables ----------
  function viewSwitch(where) {
    const box = el("div", { class: "vswitch " + where, role: "group", "aria-label": "Table view" },
      [["min", "Minutes"], ["sit", "Situations"]].map(([key, label]) =>
        el("button", { type: "button", "data-view": key, "aria-pressed": String(view === key) }, label)));
    box.addEventListener("click", (e) => {
      const b = e.target.closest("button[data-view]");
      if (b && b.dataset.view !== view) setView(b.dataset.view);
    });
    return box;
  }

  function setView(v) {
    view = v;
    for (const b of root.querySelectorAll(".vswitch button")) b.setAttribute("aria-pressed", String(b.dataset.view === v));
    for (const p of root.querySelectorAll(".mpanel")) if (p._table) p._table();
  }

  // ---------- side-by-side strip (V8) ----------
  function tape(m, codes) {
    const sideCls = (r, s) => "tside " + r.fam + (s.edge ? " edge" : "") + (s.small ? " small" : "");
    const num = (r, s) => el("span", { class: "tnum" + (s.edge ? " edge" : "") }, s.text,
      s.note ? el("span", { class: "tnote" }, s.note) : null);
    const bar = (r, s, right) => el("span", { class: "ttrack" + (right ? " right" : ""), "aria-hidden": "true" },
      el("span", { class: "tbar " + sideCls(r, s), style: "width: " + s.width + "%" }));
    const wide = m.tape.rows.map((r) => el("div", { class: "tape-row only-wide" },
      el("span", { class: "tl" }, num(r, r.sides[0]), bar(r, r.sides[0], true)),
      el("span", { class: "tc" }, el("span", { class: "tlabel" }, r.label),
        r.gap ? el("span", { class: "tgap" + (r.gap_big ? " big" : "") }, r.gap) : null),
      el("span", { class: "tr-side" }, bar(r, r.sides[1], false), num(r, r.sides[1]))));
    const narrow = m.tape.rows.map((r) => el("div", { class: "tape-row only-narrow" },
      el("span", { class: "pv " + sideCls(r, r.sides[0]) }, r.sides[0].text),
      el("span", { class: "plabel" }, r.short),
      el("span", { class: "pv right " + sideCls(r, r.sides[1]) }, r.sides[1].text)));
    const small = m.tape.rows.some((r) => r.sides.some((s) => s.small));
    return el("section", { class: "tape", "aria-label": "Side by side" },
      el("div", { class: "tape-names only-wide" },
        el("span", { class: "tl" }, m.away), el("span", { class: "tc thead-mid" }, m.tape.head), el("span", null, m.home)),
      wide, narrow,
      el("div", { class: "tape-key only-narrow" }, el("span", null, codes[0]), el("span", null, m.tape.head),
        el("span", { class: "right" }, codes[1])),
      small ? el("p", { class: "tape-small" }, "Dashed = small sample (fewer than " + R.early_season + " games).") : null);
  }

  // ---------- one team's panel ----------
  // A flag chip opens its flags from the last game in place, under the header (Steffen, Nov 5 2026:
  // it used to jump to the Changes list). One open at a time; the chip again, Esc or a click away closes it.
  let openChip = null;
  function closeFlags(refocus) {
    if (!openChip) return;
    const c = openChip;
    openChip = null;
    c.setAttribute("aria-expanded", "false");
    const pop = c.closest(".mpanel").querySelector(".fpop");
    if (pop) pop.remove();
    if (refocus) c.focus();
  }
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeFlags(true); });
  document.addEventListener("click", (e) => { if (openChip && !e.target.closest(".fpop, .mchip")) closeFlags(false); });
  window.addEventListener("hashchange", () => closeFlags(false));

  function flagPop(t, k, id) {
    const list = DATA.flags.filter((f) => f.team === t.team && f.kind === k.key);
    return el("div", { class: "fpop " + k.cls, id, role: "region", "aria-label": k.label + ", " + t.team + ", last game" },
      el("p", { class: "fpop-head" }, el("span", { class: "fpop-sym", "aria-hidden": "true" }, k.sym), " ",
        k.label + " · last game" + (t.last ? " (" + t.last.date + ")" : "")),
      el("ul", { class: "fpop-list" }, list.map((f) => el("li", null,
        // the flag's own words, with the player's name in bold (once: the words may start with it)
        f.player && f.text.startsWith(f.player) ? [el("b", null, f.player), f.text.slice(f.player.length)]
          : [f.player ? el("b", null, f.player) : null, f.player ? " · " : null, f.text],
        f.data_issue ? [" ", CBB.issueChip()] : null, f.small_sample ? [" ", CBB.smallChip()] : null))),
      el("a", { class: "fpop-more", href: link("flags", { team: t.team, type: k.key }) }, "All changes in the Changes tab ›"));
  }

  function header(t) {
    const chips = KINDS.filter((k) => t.counts[k.key]).map((k) => {
      const id = "fpop-" + t.team.replace(/\W+/g, "-") + "-" + k.cls;
      const b = el("button", { type: "button", class: "mchip tint " + k.cls, "aria-expanded": "false", "aria-controls": id,
                               "aria-label": t.counts[k.key] + " " + k.label.toLowerCase() + " in the last game" },
        k.sym + " " + t.counts[k.key]);
      b.addEventListener("click", () => {
        const again = openChip === b;
        closeFlags(false);
        if (again) return;
        openChip = b;
        b.setAttribute("aria-expanded", "true");
        b.closest(".phead-row").after(flagPop(t, k, id));
      });
      return b;
    });
    const marks = [t.early_season ? CBB.earlyChip() : null, t.small_sample ? CBB.smallChip() : null,
                   t.last && t.last.data_issue ? CBB.issueChip() : null].filter(Boolean);
    return el("div", { class: "phead-row" },
      el("h2", null, t.team, t.last ? el("span", { class: "plast" }, " · last " + t.last.line + ", " + t.last.date) : null),
      el("span", { class: "mchips" }, marks, chips));
  }

  function cellAria(p, g, c) {
    if (!c) return p.name + " " + g.code + ": " + (g.box ? "did not play" : "no box score for this game");
    if (c.text === "OUT") return p.name + " " + g.code + ": absent";
    const parts = [c.text === "—" ? "did not play" : c.text + " minutes"];
    if (c.st) parts.push("started");
    for (const k of c.flags || []) parts.push(SAYS[k]);
    if (c.role) parts.push("role change");
    return p.name + " " + g.code + ": " + parts.join(", ");
  }

  function heatCell(p, g, c) {
    const aria = cellAria(p, g, c);
    if (!c) return el("span", { class: "hc dnp", role: "img", "aria-label": aria }, "—");
    const out = c.text === "OUT";
    const kinds = c.flags || [];
    const cls = ["hc"];
    if (!out && c.min !== null && c.min >= 1) cls.push("h" + (1 + step(c.min, R.heat_steps)));
    if (kinds.length) cls.push("flagged", KIND[kinds[0]].cls);
    if (out) cls.push("out");
    // V6: dashed role-change outline, unless the ◆ new-starter ring already says it
    if (c.role && !kinds.includes("new starter")) cls.push("role");
    return el("span", { class: cls.join(" "), role: "img", "aria-label": aria },
      c.st && !out ? el("span", { class: "sbar", "aria-hidden": "true" }) : null,
      c.text, c.sym ? el("span", { class: "hc-sym", "aria-hidden": "true" }, c.sym) : null);
  }

  function gameHead(t, g) {
    const kids = [el("span", { class: "gh-code" }, g.mcode), g.res ? el("span", { class: "gh-res" }, " " + g.res) : null];
    const label = g.vs + ", " + g.date + (g.result ? ", " + g.result : "") + (g.data_issue ? ", data issue" : "");
    return el("th", { scope: "col", class: "gh" + (g.data_issue ? " gi" : "") },
      DATA.charts[g.game_id]
        ? el("a", { href: link("chart", { game: g.game_id, team: t.team, from: t.team }), "aria-label": label + ", open chart" }, kids)
        : el("span", { class: "gh-in", "aria-label": label }, kids));
  }

  function grid(t) {
    const head = el("tr", null,
      el("th", { scope: "col", class: "pin" }, "PLAYER"),
      t.games.map((g) => gameHead(t, g)),
      el("th", { scope: "col", class: "num c-szn" }, "SZN"),
      el("th", { scope: "col", class: "num c-l3 only-wide" }, "L3"),
      el("th", { scope: "col", class: "c-trend" }, "TREND"));
    const rows = t.players.map((p) => el("tr", { class: "mrow" + (p.fold ? " fold" : ""), "data-name": p.name, hidden: p.fold },
      el("th", { scope: "row", class: "pin" },
        el("span", { class: "pname only-wide" }, p.name), el("span", { class: "pname only-narrow", title: p.name }, p.short),
        el("span", { class: "ppos only-wide" }, p.pos || "—")),
      p.cells.map((c, gi) => el("td", { class: "hcell" }, heatCell(p, t.games[gi], c))),
      el("td", { class: "num c-szn" }, p.season),
      el("td", { class: "num c-l3 only-wide" }, p.last3),
      el("td", { class: "c-trend" },
        el("span", { class: "tr " + p.trend.kind + (p.trend.dir ? " " + p.trend.dir : ""), title: p.trend.title,
                     "aria-label": "Trend " + p.trend.text + ". " + p.trend.title }, p.trend.text))));
    return el("table", { class: "mgrid" }, el("thead", null, head), el("tbody", null, rows));
  }

  // The keys right above each table (Steffen, Nov 5 2026): only the colors drawn in that table.
  // Labels come from Python (DATA.guide.keys, worded from settings.py).
  const K = DATA.guide && DATA.guide.keys; // a file built without the guide draws no keys
  function minKey(table) {
    if (!K) return null;
    const [gray, tint, solid] = K.trend;
    return CBB.key(table, [
      ...K.heat.map(([c, label]) => ({ sel: ".hc." + c, cls: c, label: label + " min" })),
      { sel: ".sbar", cls: "h4 start", label: "started" },
      { sel: ".hc.role", cls: "h3 role", label: "role changed from the game before" },
      ...KINDS.filter((k) => k.key !== "absent").map((k) => ({ sel: ".hc.flagged." + k.cls, cls: "ring " + k.cls, txt: k.sym,
        label: k.label.toLowerCase().replace(/s$/, "") })),
      { sel: ".hc.out", cls: "out", txt: "OUT", label: "absent" },
      { sel: ".hc.dnp", cls: "dnp", txt: "—", label: "did not play" },
      { sel: "th.gh.gi", cls: "gi", label: "data issue game" },
      { sel: ".tr.up", cls: "more", txt: "▲", label: "TREND up" },
      { sel: ".tr.down", cls: "less", txt: "▼", label: "down" },
      { sel: ".tr.gray", cls: "trend gray", txt: "–", label: gray[1] },
      { sel: ".tr.tint", cls: "trend tint", label: "light: " + tint[1] },
      { sel: ".tr.solid", cls: "trend solid", label: "solid: " + solid[1] },
    ], "grid-legend");
  }

  function sitKey(table) {
    if (!K) return null;
    const [more, less] = K.blowout;
    return CBB.key(table, [
      { sel: ".sv.heat", cls: "h4", label: "2nd half, crunch: brighter = more minutes" },
      { sel: ".tr.up", cls: "more", txt: "▲", label: "stint length up" },
      { sel: ".tr.down", cls: "less", txt: "▼", label: "down" },
      { sel: ".cb-b.k-more", cls: "cb more", label: more[1] },
      { sel: ".cb-b.k-less", cls: "cb less", label: less[1] },
      ...K.foul.map(([c, label]) => ({ sel: ".flfill." + c, cls: "foul " + c, label: "foul min lost " + label })),
      { sel: ".small", chip: "small", label: "dashed = small sample (fewer than " + R.early_season + " games)" },
      { sel: ".sv.none", cls: "dnp", txt: "—", label: "no games for that column" },
    ], "grid-legend");
  }

  // Foul trouble and reacting blocks: the share bar against its reference tick
  function shareKey(block, tick) {
    if (!K) return null;
    const [more, less, gray] = K.share;
    return CBB.key(block, [
      { sel: ".sfill.k-more", cls: "share more", label: more[1] },
      { sel: ".sfill.k-less", cls: "share less", label: less[1] },
      { sel: ".sfill.k-even", cls: "share gray", label: gray[1] },
      { sel: ".sfill.k-noref", cls: "share gray", label: "no reference (no tick)" },
      { sel: ".sfill.small", cls: "share dash", label: "dashed = small sample" },
      { sel: ".sref", cls: "tick", label: tick },
    ]);
  }

  // ---------- Situations view (06a §4.2): six columns, each header with its game count ----------
  const small = (x) => (x && x.small ? " small" : "");
  const none = () => el("span", { class: "sv none" }, "—");

  function sitCells(p) {
    const s = p.sit;
    const heat = (x, label) => (x ? el("span", { class: "sv heat h" + x.step + small(x), title: label + ": " + x.n + " games" + (x.small ? " (small sample)" : "") }, x.text) : none());
    const stint = s.stint
      ? el("span", { class: "sv stl" + small(s.stint), title: "Average stint length in minutes, season → his last games with stints (" + s.stint.n + " games)" },
        el("span", { class: "stl-s" }, s.stint.season), el("span", { class: "stl-a", "aria-hidden": "true" }, " → "),
        el("span", { class: "tr " + s.stint.kind + (s.stint.dir ? " " + s.stint.dir : "") }, s.stint.last3))
      : none();
    const cb = el("span", { class: "sv cb" },
      el("span", { class: "cb-c" + (s.cb.close_small ? " small" : ""), title: "Close games: " + s.cb.close_n }, s.cb.close),
      el("span", { class: "cb-bar", "aria-hidden": "true" }, " | "),
      el("span", { class: "cb-b" + (s.cb.kind ? " k-" + s.cb.kind : "") + (s.cb.blow_small ? " small" : ""), title: "Blowouts: " + s.cb.blow_n }, s.cb.blow));
    const foul = s.foul
      ? el("span", { class: "sv foul" + small(s.foul), title: "Per game over " + s.foul.n + " games" },
        el("span", { class: "flbar", "aria-hidden": "true" }, el("span", { class: "flfill f" + s.foul.step, style: "width: " + s.foul.width + "%" })),
        el("span", { class: "fnum" }, s.foul.text))
      : none();
    const ramp = s.ramp ? el("span", { class: "sv ramp" + small(s.ramp), title: s.ramp.title }, s.ramp.text) : none();
    return [stint, heat(s.half, "2nd half"), heat(s.crunch, "Crunch time"), cb, foul, ramp];
  }

  function sitTable(t) {
    const head = el("tr", null, el("th", { scope: "col", class: "pin" }, "PLAYER"),
      t.sit.heads.map((h) => el("th", { scope: "col", class: "sh" }, el("span", { class: "sh-a" }, h.a), " ", el("span", { class: "sh-b" }, h.b))));
    const rows = t.players.map((p) => el("tr", { class: "srow" + (p.fold ? " fold" : ""), "data-name": p.name, hidden: p.fold },
      el("th", { scope: "row", class: "pin" },
        el("span", { class: "pname only-wide" }, p.name), el("span", { class: "pname only-narrow", title: p.name }, p.short),
        el("span", { class: "ppos only-wide" }, p.pos || "—")),
      sitCells(p).map((c) => el("td", { class: "scell" }, c))));
    return el("table", { class: "mgrid sgrid" }, el("thead", null, head), el("tbody", null, rows));
  }

  // ---------- share bar + pill (D and E; §3 row 15, §5) ----------
  function shareBar(r, cls) {
    return el("span", { class: "sbox " + cls, "aria-hidden": "true" },
      // k-even: compared with a reference and close to it; k-noref: nothing to compare with (no tick)
      r.pct === null ? null : el("span", { class: "sfill" + (r.kind ? " k-" + r.kind : r.small ? "" : r.ref === null ? " k-noref" : " k-even")
        + (r.small ? " small" : ""), style: "width: " + r.pct + "%" }),
      r.ref === null ? null : el("span", { class: "sref", style: "left: " + r.ref + "%" }));
  }

  function foulBlock(t) {
    const f = t.fouls;
    const rows = f.rows.map((r) => el("div", { class: "dfrow" },
      el("span", { class: "rlab" }, el("span", { class: "rl" }, r.label), el("span", { class: "rs" }, r.sub)),
      el("span", { class: "fright" },
        el("span", { class: "dfline" }, shareBar(r, "fbox"),
          el("span", { class: "spill" + (r.kind ? " k-" + r.kind : "") + (r.small ? " small" : "") }, r.share)),
        el("span", { class: "facts" }, r.facts.map((x) => el("span", null, x))))));
    const split = el("div", { class: "fsplit" },
      el("span", { class: "fsh" }, "BENCHED AT NEXT STOP"), f.heads.map((h) => el("span", { class: "fsh" }, h)),
      f.split.map((x) => [el("span", { class: "fwho" }, x.who),
        [x.a, x.b].map((c) => el("span", { class: "fcell" + (c.small ? " small" : "") }, c.text))]));
    // §3 row 16: the words with a dashed number whose own text doesn't say it (a row with no cases yet: "—")
    const mute = [...f.rows.filter((r) => r.small).map((r) => r.share), ...f.split.flatMap((x) => [x.a, x.b]).filter((c) => c.small).map((c) => c.text)]
      .some((txt) => !/small sample/.test(txt));
    return el("div", { class: "fblock", "data-team": t.team },
      el("h3", null, t.team, el("span", { class: "bnote" }, " · " + f.note)), rows, split,
      mute ? el("p", { class: "rsmall" }, "Dashed = small sample (fewer than " + R.early_season + " cases).") : null);
  }

  // V17: evidence lists open under their row, one open at a time per block
  function evList(t, r) {
    const head = el("div", { class: "evhead only-wide", "aria-hidden": "true" },

  // ---------- the game page's chart: both teams on one timeline (06a §4.3, §6.7-6.12) ----------
  let barMode = "pm"; // V11: opens on plus-minus; kept while the reader moves between games

      el("span", { class: "ch-n" }, n), el("span", { class: "ch-t" }, tr), el("span", { class: "ch-m" }, m),

  const panel = document.getElementById("tab-chart");
  const onSlate = (t) => DATA.slate.games.some((x) => x.away === t || x.home === t);
  const MODES = [["plain", "Plain", "Plain"], ["pm", "Plus-minus", "+/−"], ["pts", "Points", "Points"]];
  NARROW.addEventListener("change", () => {
    for (const b of document.querySelectorAll(".gm-switch button")) {
      const m = MODES.find((x) => x[0] === b.dataset.mode);
      b.textContent = NARROW.matches ? m[2] : m[1];
    }
  });

  // The chart's key, right above it (Steffen, Nov 5 2026): only what this chart draws (sel)
  function legend(chart, issue, mode) {
    const has = (sel) => !sel || !!chart.querySelector(sel);
    const item = (sel, ...kids) => (has(sel) ? el("span", null, ...kids) : null);
    const chip = (cls, txt, what) => item(".ch-cap." + cls, el("span", { class: "lg-chip " + cls }, txt), what);
    const bins = mode === "plain" ? [el("span", null, el("span", { class: "lg-bin lg-plain" }, ""), "On the floor")]
      : RULES.legend[mode].map(([b, sw, label]) => {
        const cls = mode === "pm" ? pmCls(b) : "pt-" + b;
        return item(".ch-bar." + cls, el("span", { class: "lg-bin " + cls }, sw), label);
      });
    return el("section", { class: "cz-legend mode-" + mode, "aria-label": "Legend" },
      el("span", { class: "ckey-lab" }, "KEY"),
      ...bins,
      item(".ch-tick", el("span", { class: "lg-tick" }), "No recorded cause"),
      item(".ch-endcap", el("span", { class: "lg-end" }), "On at the final horn"),
      chip("t-fo", "5F", "Fouled out"), chip("t-ft", "2F", "Foul trouble (foul count)"),
      chip("t-inj", "INJ", "Injury exit"), chip("t-bl", "+" + (RULES.blowout + 1), "Blowout (margin)"),
      item(".ch-strip[data-strip=size]", el("span", { class: "lg-size" }, "0–5"), "Bigs on the floor"),
      item(".ch-strip[data-strip=pace]", el("span", { class: "lg-pace" }), "Pace: teal = faster"),
      item(".ch-ot", el("span", { class: "lg-ot" }), "Overtime"),
      issue ? el("span", null, el("span", { class: "lg-band" }), "Striped band = not 5 on the floor") : null,
      el("span", null, wide("Hover or click a bar for that stint; a click lights every stint at the same time. Click a gap for why he sat."),
        narrow("Tap a bar for that stint. Tap a gap for why he sat. Tap a team name to fold it.")));
  }
  const wide = (x) => el("span", { class: "only-wide" }, x);
  const narrow = (x) => el("span", { class: "only-narrow" }, x);

  CBB.onTab.chart = function (params) {
    const c = DATA.charts[params.get("game")];
    panel.textContent = "";
    if (!c) {
      panel.append(el("p", { class: "not-built" }, "That chart isn't in this report."),
        el("a", { class: "cz-back", href: link("slate") }, "← Slate"));
      return;
    }
    const top = c.teams[params.get("team")] ? params.get("team") : [c.away, c.home].find(onSlate) || c.home;
    const other = top === c.away ? c.home : c.away;
    const from = params.get("from") || top; // the slate team whose games these are (the picker)
    const me = c.teams[top].code;
    // Game picker (§4.3 item 1): the slate team's charted games, newest first
    const pt = (DATA.teams || []).find((x) => x.team === from);
    const list = pt ? pt.games.filter((x) => DATA.charts[x.game_id]) : [];
    const at = list.findIndex((x) => String(x.game_id) === String(c.game_id));
    const go = (x) => link("chart", { game: x.game_id, team: from, from });
    const ok = c.status === "pass" ? el("span", { class: "cz-ok" },
      svg("svg", { width: 12, height: 12, viewBox: "0 0 12 12", "aria-hidden": "true" },
        svg("path", { d: "M2 6.5 L5 9 L10 3", fill: "none", stroke: "currentColor", "stroke-width": 1.6 })),
      "Checks passed" + (c.fixups ? " (fix-up rule applied)" : "")) : null;
    const [as, hs] = c.scores || [];
    const mine = top === c.home ? hs : as, theirs = top === c.home ? as : hs;
    const result = mine !== null && mine !== undefined && theirs !== null && theirs !== undefined
      ? (mine > theirs ? "W " : mine < theirs ? "L " : "") + mine + "–" + theirs : null;
    const step = (x, label, sym) => x
      ? el("a", { class: "gp-step", href: go(x), "aria-label": label }, sym)
      : el("span", { class: "gp-step off", "aria-label": label, "aria-disabled": "true" }, sym);
    const card = el("section", { class: "cz-card" + (c.issue ? " issue" : ""), "aria-label": "Rotation chart, both teams" },
      CBB.gameChart(c, top));
    let leg = c.pbp ? legend(card, !!c.issue, c.nox ? "plain" : barMode) : null;
    const sw = el("div", { class: "gm-switch", role: "group", "aria-label": "Bar color" },
      el("span", { class: "gm-lab only-wide" }, "COLOR BARS BY"),
      el("div", { class: "gm-btns" }, MODES.map(([m, label, short]) => el("button", {
        type: "button", "data-mode": m, "aria-pressed": String(m === barMode) }, NARROW.matches ? short : label))));
    sw.addEventListener("click", (e) => {
      const b = e.target.closest("button[data-mode]");
      if (!b || b.dataset.mode === barMode) return;
      const ch = card.querySelector(".ch-game");
      ch.classList.remove("mode-" + barMode);
      barMode = b.dataset.mode;
      ch.classList.add("mode-" + barMode);
      for (const x of sw.querySelectorAll("button[data-mode]")) x.setAttribute("aria-pressed", String(x === b));
      if (leg) { const n = legend(card, !!c.issue, barMode); leg.replaceWith(n); leg = n; }
    });
    panel.append(...[
      at >= 0 ? el("section", { class: "gp only-wide", "aria-label": "Pick a game" },
        el("span", { class: "gp-lab" }, from.toUpperCase() + " · NEWEST FIRST"),
        list.map((x, i) => el("a", { class: "gp-chip", href: go(x), "aria-current": i === at ? "page" : null },
          el("span", null, x.mcode), x.res ? [" ", el("span", { class: "gp-res" + (x.res === "W" ? " w" : "") }, x.res)] : null)),
        el("a", { class: "gp-older", href: link("matchup", { team: from }) }, "Older games ›")) : null,
      el("div", { class: "gp-phone only-narrow" },
        at >= 0 ? step(list[at + 1], "Older game", "‹") : null,
        el("span", { class: "gp-mid" }, el("span", { class: "gp-title" }, me + (top === c.home ? " vs " : " @ ") + other + " · " + c.day),
          el("span", { class: "gp-line" }, [result, c.len_short].filter(Boolean).join(" · "),
            c.status === "pass" ? [" · ", el("span", { class: "gp-ok" }, "✓ checks")] : null)),
        at >= 0 ? step(at > 0 ? list[at - 1] : null, "Newer game", "›") : null),
      el("section", { class: "cz-head" },
        el("div", { class: "cz-title only-wide" },
          el("h1", null, top + (top === c.home ? " vs " : " @ ") + other),
          el("p", { class: "cz-meta" }, el("span", null, c.date),
            c.final ? el("span", { class: "cz-final" }, "Final · " + c.final) : null,
            el("span", { class: "cz-len" + (c.ot ? " ot" : "") }, c.length), ok)),
        c.pbp && !c.nox ? sw : null),
      c.issue ? el("section", { class: "cz-banner", "aria-label": "Data issue" },
        el("span", { class: "cz-banner-lab" }, CBB.issueIcon(16, true), "DATA ISSUE"),
        el("span", { class: "cz-banner-body" },
          el("span", { class: "cz-bh" }, c.issue.head),
          c.issue.detail ? el("span", { class: "cz-bd" }, c.issue.detail) : null,
          el("span", { class: "cz-bf" }, "This chart is built from substitutions. Box score minutes and the flags still count."))) : null,
      leg, card].filter(Boolean));
    return from;
  };
})();

/* "How to read this" (#key; Steffen, Nov 5 2026): every color and symbol in the report, for a
   first-time reader. The words and the cut points in them come from Python (engine/report_guide.py,
   DATA.guide.sections); this file only lays them out, each with its swatch. */
CBB.render(function () {
  "use strict";
  const { DATA, el } = CBB;
  const root = document.getElementById("tab-key");
  const G = DATA.guide;
  if (!G) {
    root.append(el("p", { class: "not-built" }, "This file has no color guide."));
    return;
  }
  root.append(el("div", { class: "guide" },
    el("header", null, el("h1", null, "How to read this"),
      el("p", { class: "guide-lede" }, "What every color, chip and symbol in this report stands for. "
        + "Each table and chart also has a small key right above it with only the colors it uses.")),
    G.sections.map((s) => el("section", { class: "gsec", "aria-label": s.title },
      el("h2", null, s.title),
      s.intro ? el("p", { class: "gsec-intro" }, s.intro) : null,
      el("ul", { class: "gitems" }, s.items.map((i) => el("li", { class: "gitem" },
        el("span", { class: "gitem-sw" }, i.sw || i.chip ? CBB.swatch(i.sw, i.txt, i.chip) : null),
        el("span", { class: "gitem-label" }, i.label),
        el("span", { class: "gitem-says" }, i.says))))))));
});

CBB.start();
</script>
</body>
</html>
