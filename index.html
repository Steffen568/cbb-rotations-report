<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CBB Rotations</title>
<style>
/* Design tokens (specs/04a-report-design.md section 2). Every color in the report comes from here. */
:root {
  /* interface */
  --ground: #0B0E12;
  --header: #0E1217;
  --surface: #12161C;
  --surface-2: #181D25;
  --popover: #1A2029;
  --row-hover: #161B22;
  --line: #232A34;
  --line-soft: #1C222B;
  --line-strong: #2E3744;
  --line-heavy: #4A5464;
  --text: #E7EBF0;
  --text-hover: #FFFFFF;
  --text-2: #A7B0BC;
  --text-3: #7C8794;
  --text-off: #4A5360;
  /* flags */
  --flag-absent: #FF7A85;
  --flag-spike: #6CB8FF;
  --flag-drop: #FFA24D;
  --flag-new: #C3A6FF;
  --flag-rotation: #D7DEE7;
  /* reason tags */
  --tag-fouled-out: #FF5C6C;
  --tag-foul-trouble: #FFB547;
  --tag-injury: #F78FE0;
  --tag-blowout: #5AA8FF;
  --tag-end: #E7EBF0;
  --tag-none: #5C6676;
  /* markers and chart */
  --issue: #F2C35B;
  --issue-bg: #1D1810;
  --issue-line: #5C4A1E;
  --issue-text: #D9C28A;
  --issue-head: #F6E2B0;
  --issue-column: #1A1610;
  --on-floor: #7D8DA1;
  --starter-badge: #C9D2DC;
  --ot-band: #171C24;
  --period-line: #5C6676;
  --bench-bar: #3A4554;
  --ok: #7FD8A8;
  /* redesign (specs/06a-redesign-design.md section 2) */
  --card-0: #161C24;
  --card-1: #1F2935;
  --card-2: #2B3A4D;
  --card-3: #3B5068;
  --card-4: #4F6A8A;
  --pace-1: #0F2A2A;
  --pace-2: #134040;
  --pace-3: #17595A;
  --pace-4: #1C7473;
  --pace-5: #2A9290;
  --pace-accent: #4FD1C5;
  --pace-dot: #7FB8B3;
  --size-0: #161B22;
  --size-1: #262E39;
  --size-2: #3A4554;
  --size-3: #56637A;
  --size-4: #7D8DA1;
  --size-5: #AEB9C7;
  --size-share-0: #1A2029;
  /* Minutes heat (06a §2, scale 1) and more / less (blue / orange) */
  --heat-1: #1A212B;
  --heat-2: #243142;
  --heat-3: #2F4259;
  --heat-4: #3E5874;
  --heat-5: #4F6A8A;
  --heat-dim-text: #C3CBD5;
  --more: #6CB8FF;
  --less: #FFA24D;
  --foul-1: #6B5530;
  --foul-2: #B9853A;
  --foul-3: #FFB547;
  /* game page bars (06a §2): plus-minus mild steps and points mode */
  --pm-more-mild: #3D7BB8;
  --pm-less-mild: #B86A2A;
  --pts-0: #2B3A4D;
  --pts-1: #3E5874;
  --pts-2: #5D7DA3;
  --pts-3: #9CC3EE;
  /* type, shape, spacing */
  --sans: -apple-system, 'Segoe UI', Roboto, system-ui, sans-serif;
  --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace;
  --page-max: 1376px;
  --gutter: 32px;
  --section-gap: 28px;
  color-scheme: dark;
}
@media (max-width: 599px) {
  :root { --gutter: 16px; --section-gap: 18px; }
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; background: var(--ground); color: var(--text);
  font-family: var(--sans); font-size: 14px; line-height: 1.45; overflow-wrap: break-word;
}
a { color: var(--text); text-decoration: none; }
a:hover { color: var(--text-hover); }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 599px) { .only-wide { display: none !important; } }
@media (min-width: 600px) { .only-narrow { display: none !important; } }

/* Flag colors: each flag kind sets --c, chips tint from it */
.k-absent { --c: var(--flag-absent); }
.k-spike { --c: var(--flag-spike); }
.k-drop { --c: var(--flag-drop); }
.k-new { --c: var(--flag-new); }
.k-rotation { --c: var(--flag-rotation); }
.tint {
  color: var(--c);
  background: color-mix(in srgb, var(--c) 10%, transparent);
  border: 1px solid color-mix(in srgb, var(--c) 30%, transparent);
}

/* Top bar (section 3) */
.top {
  display: flex; align-items: center; gap: 28px; flex-wrap: wrap; padding: 0 var(--gutter);
  min-height: 60px; border-bottom: 1px solid var(--line); background: var(--header);
}
.brand-row { display: contents; }
.brand {
  display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-weight: 700;
  font-size: 14px; letter-spacing: 0.14em;
}
.brand-dim { fill: var(--text-3); }
/* Breadcrumb (06a V4): Slate › Away @ Home › Team games. The phone shows the back link instead. */
/* Tabs (Steffen, Nov 5 2026): Slate · Changes · How to read this. The breadcrumb follows them. */
.tabs { order: 1; display: flex; align-items: stretch; align-self: stretch; gap: 4px; }
.tabs a {
  display: flex; align-items: center; min-height: 44px; padding: 0 10px; font-size: 13.5px; font-weight: 600;
  color: var(--text-2); border-bottom: 2px solid transparent; white-space: nowrap;
}
.tabs a:hover { color: var(--text); }
.tabs a[aria-current="page"] { color: var(--text); border-bottom-color: var(--text); }
.crumbs { order: 2; padding-left: 12px; border-left: 1px solid var(--line); display: flex; align-items: center; gap: 8px; font-size: 13px; align-self: stretch; }
.crumbs a, .crumbs .crumb-off { display: flex; align-items: center; min-height: 44px; padding: 0 6px; }
.crumbs a { color: var(--text-2); border-bottom: 2px solid transparent; }
.crumbs a[aria-current="page"] { color: var(--text); font-weight: 600; border-bottom-color: var(--text); }
.crumbs .crumb-off { color: var(--text-3); }
.crumbs .crumb-sep { color: var(--text-off); }
.back { display: none; }
.sample-badge {
  order: 3; margin-left: auto; font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; color: var(--text-2);
  border: 1px dashed var(--line-heavy); padding: 3px 8px; border-radius: 3px; white-space: nowrap;
}
.sample-badge + .sample-badge { margin-left: 8px; }
@media (max-width: 599px) {
  .top { flex-direction: column; align-items: stretch; gap: 0; padding: 0; min-height: 0; }
  .brand-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; flex-wrap: wrap; }
  .brand { gap: 8px; font-size: 13px; }
  .brand svg { width: 16px; height: 16px; }
  .crumbs { display: none; }
  .tabs { display: flex; gap: 0; border-top: 1px solid var(--line); padding: 0 8px; }
  .tabs a { justify-content: center; padding: 0 10px; font-size: 13px; }
  .back:not([hidden]) {
    display: flex; align-items: center; min-height: 44px; padding: 0 16px; border-top: 1px solid var(--line);
    font-size: 14px; font-weight: 600;
  }
  .sample-badge { margin-left: 0; font-size: 10px; padding: 2px 6px; }
  .sample-badge + .sample-badge { margin-left: 0; }
}

/* Page */
main {
  max-width: var(--page-max); margin: 0 auto; padding: 32px var(--gutter) 48px;
}
.tab-panel { display: flex; flex-direction: column; gap: var(--section-gap); }
@media (max-width: 599px) { main { padding: 18px var(--gutter) 32px; } }
.not-built { margin: 0; color: var(--text-3); }

/* Marker chips (section 5), the same look everywhere */
.chip-issue {
  flex: none; display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono);
  font-size: 10.5px; letter-spacing: 0.08em; font-weight: 400; color: var(--issue);
  border: 1px solid var(--issue-line); background: var(--issue-bg); padding: 1px 6px; border-radius: 3px;
}
.chip-small {
  flex: none; display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono);
  font-size: 10.5px; letter-spacing: 0.06em; font-weight: 400; color: var(--starter-badge);
  border: 1px dashed var(--text-3); padding: 1px 6px; border-radius: 3px;
}
.chip-early {
  flex: none; display: inline-flex; align-items: center; font-family: var(--mono); font-size: 10.5px;
  letter-spacing: 0.06em; font-weight: 400; color: var(--text-2); border: 1px solid var(--line-strong);
  padding: 1px 6px; border-radius: 3px;
}

/* Slate page (specs/06a-redesign-design.md section 4.1; mockups Main.dc.html, PhoneSlate.dc.html).
   Colors are the 06a section 2 tokens (base.css). */
.slate-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 24px; }
.slate-titles { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.slate-titles h1 { margin: 0; font-size: 28px; font-weight: 650; letter-spacing: -0.01em; }
.slate-titles p { margin: 0; color: var(--text-2); }
.psummary a { text-decoration: underline; text-underline-offset: 2px; }

/* Sort switch (V15) */
.sort { display: flex; align-items: center; gap: 8px; }
.sort-label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; color: var(--text-3); }
.sort-btns { display: flex; border: 1px solid var(--line-strong); border-radius: 4px; overflow: hidden; }
.sort button {
  min-height: 40px; padding: 0 14px; border: 0; background: transparent; color: var(--text-2);
  font: inherit; font-size: 13px; cursor: pointer;
}
.sort button + button { border-left: 1px solid var(--line-strong); }
.sort button:hover { background: var(--row-hover); }
.sort button[aria-pressed="true"] { background: var(--text); color: var(--ground); font-weight: 600; }

/* Summary tiles (V16) */
.stiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr)); gap: 12px; }
.stile {
  display: flex; flex-direction: column; gap: 2px; padding: 12px 16px; background: var(--surface);
  border: 1px solid var(--line); border-top: 2px solid var(--c); border-radius: 6px;
}
.stile-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.stile-sym { font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: var(--c); }
.stile-num { font-family: var(--mono); font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stile-label { font-size: 13px; color: var(--text-2); }
.stile.zero { border-top-color: var(--line-strong); }
.stile.zero .stile-sym { color: var(--text-3); }
a.stile:hover { filter: brightness(1.25); }
.t-changes { --c: var(--text); }
.t-pace { --c: var(--pace-accent); }
.t-issue { --c: var(--issue); }
.t-noline { --c: var(--text-2); }

/* Game cards */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(620px, 100%), 1fr)); gap: 16px; align-items: start; }
.card {
  display: flex; flex-direction: column; min-width: 0; background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
}
.card:hover { border-color: var(--line-heavy); color: var(--text); }
.card.small { border-style: dashed; border-color: var(--line-heavy); }
.chead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.ctitle { font-size: 16px; font-weight: 650; }
.tip { font-family: var(--mono); font-size: 12px; color: var(--text-3); white-space: nowrap; }
.fill { flex: 1 1 0; }
.cline { font-family: var(--mono); font-size: 12.5px; color: var(--text); }
.cline.no-line { color: var(--text-3); border: 1px solid var(--line-strong); padding: 1px 7px; border-radius: 3px; }
.after-tip { color: var(--text-3); }
.chg {
  flex: none; font-family: var(--mono); font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em;
  padding: 3px 9px; border-radius: 3px; color: var(--text); background: var(--chg); border: 1px solid var(--chg);
}
.chg.card-0 { --chg: var(--card-0); color: var(--text-3); border-color: var(--line-strong); }
.chg.card-1 { --chg: var(--card-1); }
.chg.card-2 { --chg: var(--card-2); }
.chg.card-3 { --chg: var(--card-3); }
.chg.card-4 { --chg: var(--card-4); }
.card-small {
  flex: none; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; color: var(--text-2);
  border: 1px dashed var(--text-3); padding: 2px 8px; border-radius: 3px;
}

.cgrid { display: grid; grid-template-columns: minmax(0, 1fr) 34px 58px 150px 112px; gap: 0 10px; align-items: center; }
.cols { padding: 8px 16px 2px; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; color: var(--text-3); }
.cols-pace { display: flex; justify-content: space-between; gap: 6px; }
.r { text-align: right; }
.trow { display: flex; flex-direction: column; gap: 6px; padding: 8px 16px 10px; border-top: 1px solid var(--line-soft); }
.cols + .trow { border-top: 0; }
.tname { display: flex; flex-direction: column; min-width: 0; }
.tname-team { font-weight: 650; font-size: 15px; }
.tlast { font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gp, .rot { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.gp { color: var(--text-2); }
.rot { font-size: 13px; }
.rot.small { color: var(--text-2); }
.none { font-family: var(--mono); color: var(--text-off); }
.cpace { display: flex; align-items: center; gap: 8px; min-width: 0; }
.csize { display: flex; align-items: center; justify-content: flex-end; gap: 6px; font-family: var(--mono); font-size: 12.5px; }
.ht.small { color: var(--text-2); }

/* Pace dial: slow on the left, fast on the right */
.dial { position: relative; flex: 1 1 0; min-width: 24px; height: 6px; background: var(--header); border: 1px solid var(--line); border-radius: 3px; }
.dial.small { border-style: dashed; border-color: var(--line-heavy); }
.dial-dot {
  position: absolute; top: -4px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%;
  border: 2px solid var(--ground); background: var(--pace-dot);
}
.dial-dot.fast { background: var(--pace-accent); }
.dial-ref { position: absolute; top: -4px; bottom: -4px; width: 0; margin-left: -1px; border-left: 2px dashed var(--text-3); }
.dial.small .dial-dot { top: -3px; width: 10px; height: 10px; margin-left: -5px; border: 1.5px dashed var(--text-2); background: var(--surface); }

/* Pace and bigs' share chips (06a section 3 rows 9 and 12) */
.pace-chip, .bigs-chip {
  flex: none; font-family: var(--mono); font-size: 12.5px; font-weight: 600; padding: 1px 6px; border-radius: 3px;
  text-align: center; color: var(--text); background: var(--chip);
}
.pace-chip { min-width: 46px; }
.bigs-chip { min-width: 38px; font-size: 12px; }
.pace-1 { --chip: var(--pace-1); }
.pace-2 { --chip: var(--pace-2); }
.pace-3 { --chip: var(--pace-3); }
.pace-4 { --chip: var(--pace-4); }
.pace-5 { --chip: var(--pace-5); color: var(--ground); }
.size-share-0 { --chip: var(--size-share-0); }
.size-1 { --chip: var(--size-1); }
.size-2 { --chip: var(--size-2); }
.size-3 { --chip: var(--size-3); }
.size-4 { --chip: var(--size-4); color: var(--ground); }
.pace-chip.small, .bigs-chip.small {
  background: none; color: var(--text-2); border: 1px dashed var(--line-heavy); font-weight: 400;
}
.pace-n { flex: none; font-family: var(--mono); font-size: 11px; color: var(--text-3); }

/* Change chips under each team */
.heads { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.head {
  display: inline-flex; align-items: center; font-family: var(--mono); font-size: 11.5px; font-weight: 600;
  padding: 2px 7px; border-radius: 3px;
}
.more { font-family: var(--mono); font-size: 11.5px; color: var(--text-2); padding: 2px 6px; }
.quiet { font-size: 12px; color: var(--text-3); }
.issue-line { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--issue-text); min-width: 0; }

.cfoot {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; padding: 8px 16px 12px;
  border-top: 1px solid var(--line-soft); font-size: 12px; color: var(--text-3);
}
.gap { font-family: var(--mono); font-size: 11.5px; color: var(--text-3); }
.gap.big {
  font-weight: 700; letter-spacing: 0.06em; color: var(--ground); background: var(--pace-accent);
  padding: 2px 8px; border-radius: 3px;
}
.small-note { padding: 0 16px 12px; font-size: 12px; color: var(--text-3); }

/* Footer (04a section 3) */
.foot {
  display: flex; flex-wrap: wrap; gap: 8px 24px; padding-top: 20px; border-top: 1px solid var(--line);
  font-size: 12px; color: var(--text-3);
}

/* Phone (PhoneSlate.dc.html) */
.phead { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.phead-l1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.phead-l1 .ctitle { font-size: 15px; }
.phead-l2 { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-family: var(--mono); font-size: 11.5px; color: var(--text-2); }
.phead-l2 .cline { font-size: 11.5px; }
.phead-l2 .cline.no-line { padding: 0 5px; }
.phead-l2 .gap.big { font-size: 11.5px; padding: 0 6px; border-radius: 2px; }
.pteam { display: flex; flex-direction: column; gap: 6px; padding: 8px 12px 10px; }
.pteam + .pteam { border-top: 1px solid var(--line-soft); }
.pteam-l1 { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.pteam-name { font-weight: 650; }
.pteam-gp { font-family: var(--mono); font-size: 11.5px; color: var(--text-3); white-space: nowrap; }
.pteam-l2 { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11.5px; }
.pteam-l2 .pace-chip, .pteam-l2 .bigs-chip { font-size: 11.5px; min-width: 0; }
.plab { color: var(--text-3); }
.plab.sz { margin-left: 6px; }
.pteam .head { font-size: 11px; padding: 1px 6px; }
.pteam .more { font-size: 11px; padding: 1px 4px; }

@media (max-width: 599px) {
  .slate-head { flex-direction: column; align-items: stretch; gap: 14px; }
  .slate-titles { gap: 4px; }
  .slate-titles h1 { font-size: 22px; }
  .slate-titles p { font-size: 13px; }
  .sort-btns { flex: 1 1 0; }
  .sort button { flex: 1 1 0; min-height: 44px; padding: 0 4px; }
  /* 06a §12: a 44 px tap area for the summary line's link, without moving the line */
  .psummary a { display: inline-block; padding: 14px 0; margin: -14px 0; }
  .cards { gap: 14px; }
  .small-note { padding: 0 12px 10px; }
  .foot { flex-direction: column; gap: 4px; padding-top: 14px; }
}

/* Flags list (specs/04a-report-design.md section 4.2; mockups Flags.dc.html, PhoneFlags.dc.html).
   Rows switch to phone cards below 900 px, where the five laptop columns no longer fit. */
@media (max-width: 899px) { .fw { display: none !important; } }
@media (min-width: 900px) { .fn { display: none !important; } }

.flags-layout { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
.flags-main { flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }

/* Filter sidebar */
.fside {
  flex: 1 1 248px; max-width: 280px; display: flex; flex-direction: column; gap: 22px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 18px;
}
.fside-head { display: flex; justify-content: space-between; align-items: center; }
.fside-head h2 { margin: 0; font-size: 13px; font-family: var(--mono); letter-spacing: 0.12em; color: var(--text-2); }
.flink {
  background: none; border: 0; padding: 0; color: var(--text-2); font: inherit; font-size: 13px;
  text-decoration: underline; cursor: pointer; min-height: 32px;
}
.fgroup { border: 0; margin: 0; padding: 0; min-width: 0; }
.fgroup legend, .ffield label { padding: 0; font-size: 12px; color: var(--text-3); }
.fgroup legend { margin-bottom: 8px; }
.ftypes { display: flex; flex-direction: column; gap: 6px; }
.ftype {
  display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border-radius: 4px;
  font: inherit; font-size: 13px; cursor: pointer; text-align: left;
  color: var(--text-3); background: transparent; border: 1px solid var(--line-soft);
}
.ftype[aria-pressed="true"] { color: var(--text); background: var(--surface-2); border-color: var(--line-strong); }
.ftype-sym { width: 30px; font-family: var(--mono); font-size: 11.5px; font-weight: 700; color: var(--text-off); }
.ftype[aria-pressed="true"] .ftype-sym { color: var(--c); }
.ftype-label { flex: 1 1 0; }
.ftype-n { font-family: var(--mono); font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.fposes { display: flex; gap: 6px; }
.fpos {
  flex: 1 1 0; min-height: 40px; border-radius: 4px; font-family: var(--mono); font-size: 13px; font-weight: 600;
  cursor: pointer; color: var(--text-2); background: transparent; border: 1px solid var(--line-strong);
}
.fpos[aria-pressed="true"] { color: var(--ground); background: var(--text); border-color: var(--text); }
.fselects { display: flex; flex-direction: column; gap: 22px; }
.ffield { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fside select, .fside input[type="text"], #f-sort {
  width: 100%; min-height: 40px; background: var(--ground); color: var(--text); border: 1px solid var(--line-strong);
  border-radius: 4px; padding: 0 10px; font: inherit;
}
.fside input[type="text"] { font-family: var(--mono); font-size: 13px; }
.fsal { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.fsal .ffield label { font-size: 11px; }
.fcheck { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; color: var(--text-2); min-height: 32px; cursor: pointer; }
.fcheck input { width: 16px; height: 16px; margin: 0; accent-color: var(--text); }

/* List head: count and sort */
.flist-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.fcount { margin: 0; font-size: 22px; font-weight: 650; }
.fsorts { display: flex; align-items: center; border: 1px solid var(--line-strong); border-radius: 4px; overflow: hidden; }
.fsorts-label { padding: 0 10px; font-size: 12px; color: var(--text-3); }
.fsort {
  min-height: 36px; padding: 0 12px; border: 0; border-left: 1px solid var(--line-strong); font: inherit;
  font-size: 13px; cursor: pointer; color: var(--text-2); background: transparent;
}
.fsort[aria-pressed="true"] { color: var(--ground); background: var(--text); }

/* The list and its rows */
.flist { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.fcols, .fmain {
  display: grid; grid-template-columns: 52px minmax(180px, 220px) 76px minmax(0, 1fr) 150px; gap: 0 14px; padding: 0 16px;
}
.fcols {
  padding-top: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--line);
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; color: var(--text-3);
}
.frow { border-bottom: 1px solid var(--line-soft); }
.frow:last-child { border-bottom: 0; }
.fmain {
  grid-template-areas: "chip name sal what game" "chip sub sal what game"; grid-template-rows: auto 1fr;
  align-items: start; padding-top: 11px; padding-bottom: 11px;
}
.fmain:hover { background: var(--row-hover); }
.fchip {
  grid-area: chip; display: flex; align-items: center; justify-content: center; height: 24px; border-radius: 3px;
  font-family: var(--mono); font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em;
}
.fname { grid-area: name; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.fsub { grid-area: sub; font-size: 12px; color: var(--text-3); }
.fsalary { grid-area: sal; text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.fsalary.none { color: var(--text-3); }
.fwhat { grid-area: what; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fgame { grid-area: game; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; font-size: 13px; }
.fline { line-height: 1.9; }
.num {
  font-family: var(--mono); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--c);
  background: color-mix(in srgb, var(--c) 8%, transparent); border: 0; border-bottom: 1px dashed var(--c);
  padding: 0 3px; border-radius: 2px; min-height: 24px; cursor: pointer;
}
button.num:hover { filter: brightness(1.3); }
.num.words { font-family: var(--sans); font-weight: 400; color: var(--text); }
.dim { color: var(--text-2); }
.ftags { display: flex; flex-wrap: wrap; gap: 6px; }
.rtag { font-size: 12px; padding: 1px 7px; border-radius: 3px; }
.rtag.quiet { color: var(--text-3); border: 1px solid var(--line-strong); }
.rtag.loud {
  color: var(--t); font-weight: 600; background: color-mix(in srgb, var(--t) 8%, transparent);
  border: 1px solid color-mix(in srgb, var(--t) 40%, transparent);
}
.t-fouled-out { --t: var(--tag-fouled-out); }
.t-foul-trouble { --t: var(--tag-foul-trouble); }
.t-injury-exit { --t: var(--tag-injury); }
.t-blowout { --t: var(--tag-blowout); }

/* Evidence panel, under its row */
.fev {
  display: flex; flex-wrap: wrap; gap: 20px 36px; margin: 0 16px 14px 82px; padding: 16px 18px;
  background: var(--header); border: 1px solid var(--line-strong); border-radius: 6px;
}
.ev-chart { display: flex; flex-direction: column; gap: 10px; }
.ev-label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; color: var(--text-3); }
.ev-plot { padding-top: 16px; }
.ev-bars { position: relative; display: flex; align-items: flex-end; gap: 6px; height: 52px; border-bottom: 1px solid var(--line-strong); }
.ev-bar { position: relative; display: flex; align-items: flex-end; width: 26px; height: 100%; }
.ev-fill { display: block; width: 100%; height: var(--h); background: var(--bench-bar); }
.ev-num {
  position: absolute; left: -4px; right: -4px; bottom: calc(var(--h) + 3px); text-align: center;
  font-family: var(--mono); font-size: 10.5px; color: var(--text-3); font-variant-numeric: tabular-nums;
}
.ev-bar.this .ev-fill { background: var(--c); outline: 1px solid var(--c); outline-offset: 2px; }
.ev-bar.this .ev-num { color: var(--c); bottom: calc(var(--h) + 5px); }
.ev-avg { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--text-2); pointer-events: none; }
.ev-note { font-size: 12px; color: var(--text-3); }
.ev-facts { margin: 0; display: grid; grid-template-columns: auto auto; gap: 8px 18px; align-content: start; font-size: 13px; }
.ev-facts dt { color: var(--text-3); }
.ev-facts dd { margin: 0; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.ev-dim { color: var(--text-3); }
.ev-team {
  align-self: flex-end; display: flex; align-items: center; min-height: 40px; padding: 0 14px;
  border: 1px solid var(--line-strong); border-radius: 4px; font-size: 13px;
}

/* Nothing to show */
.fempty { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 56px 16px; text-align: center; }
.fempty svg { fill: var(--line-heavy); }
.fempty p { margin: 0; font-size: 15px; font-weight: 600; }
.fclear {
  min-height: 40px; padding: 0 16px; background: var(--surface-2); color: var(--text); border: 1px solid var(--line-strong);
  border-radius: 4px; font: inherit; cursor: pointer;
}

/* Phone (and narrow tablets): filter button, a panel that pushes the list down, cards */
.fbar { display: flex; align-items: center; gap: 8px; width: 100%; }
.fbtn {
  display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; background: var(--surface);
  color: var(--text); border: 1px solid var(--line-strong); border-radius: 4px; font: inherit; font-weight: 600; cursor: pointer;
}
.fbtn-n { font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--text-2); }
.fbar-sort { margin-left: auto; font-size: 12px; color: var(--text-3); }
#f-sort { width: auto; min-height: 44px; background: var(--surface); }
.fline-btn {
  display: block; width: 100%; padding: 8px 0 0; background: none; border: 0; border-top: 1px solid var(--line-soft);
  color: var(--text); font: inherit; font-size: 14px; line-height: 1.7; text-align: left; cursor: pointer; min-height: 44px;
}
.fline-btn .num { padding: 0 2px; min-height: 0; }

@media (max-width: 899px) {
  .flags-layout { gap: 12px; }
  .flags-main { flex-basis: 100%; gap: 12px; }
  .fside { flex-basis: 100%; max-width: none; gap: 14px; padding: 14px; border-color: var(--line-strong); }
  .fside:not(.open) { display: none; }
  .ftypes { flex-direction: row; flex-wrap: wrap; }
  .ftype {
    gap: 6px; font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--text-off);
    border-color: var(--line-strong);
  }
  .ftype[aria-pressed="true"] {
    color: var(--c); background: color-mix(in srgb, var(--c) 10%, transparent);
    border-color: color-mix(in srgb, var(--c) 30%, transparent);
  }
  .ftype-sym { width: auto; font-size: 12px; }
  .ftype-label { display: none; }
  .ftype-n { color: inherit; font-size: 12px; }
  .fselects { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .fcount-wrap { font-size: 13px; color: var(--text-2); }
  .fcount { display: inline; font-size: 13px; font-weight: 400; }
  .flist { background: none; border: 0; border-radius: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .frow, .frow:last-child { padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
  .fmain {
    grid-template-columns: auto minmax(0, 1fr) auto; grid-template-rows: none;
    grid-template-areas: "chip name sal" "sub2 sub2 sub2" "what what what"; gap: 8px 10px; padding: 0; align-items: center;
  }
  .fmain:hover { background: none; }
  .fchip { width: 40px; height: 22px; font-size: 11px; }
  .fname { font-size: 15px; }
  .fsalary { font-size: 13px; }
  .fsub2 { grid-area: sub2; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 12px; color: var(--text-3); }
  .fev { flex-direction: column; gap: 10px; margin: 10px 0 0; padding: 12px; border-radius: 4px; }
  .ev-bars { gap: 4px; height: 44px; }
  .ev-bar { flex: 1 1 0; width: auto; }
  .ev-num { font-size: 10px; }
  .ev-facts { grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; }
  .ev-team { align-self: flex-start; }
  .fempty { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
}

/* Teams tab (specs/04a-report-design.md section 4.3; mockups Team.dc.html, PhoneTeam.dc.html).
   Only the minutes table scrolls sideways, inside its own box (.mt-box); the page never does. */

/* Header */
.thead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 32px; }
.thead-main { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tpick-row { display: flex; align-items: center; gap: 10px; }
.tpick-row label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; color: var(--text-3); }
.tpick {
  min-height: 40px; max-width: 100%; background: var(--ground); color: var(--text); border: 1px solid var(--line-strong);
  border-radius: 4px; padding: 0 10px; font: inherit;
}
.thead h1 { margin: 0; font-size: 30px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.2; }
.tline { margin: 0; color: var(--text-2); }
.tchips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tchips-label { font-size: 12px; color: var(--text-3); margin-right: 4px; }
.tchip {
  display: inline-flex; align-items: center; min-height: 32px; font-family: var(--mono); font-size: 13px;
  font-weight: 600; padding: 0 10px; border-radius: 3px;
}
.tchip:hover { color: var(--c); filter: brightness(1.25); }

/* Sections */
.tsec { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.tsec h2 { margin: 0; font-size: 17px; font-weight: 650; }
.h-sub { font-weight: 400; font-size: 13px; color: var(--text-3); }
.tsec-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px; }
.mt-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--text-2); }
.mt-legend > span { display: inline-flex; align-items: center; gap: 6px; }
.lg-flag { font-family: var(--mono); color: var(--flag-spike); }
.lg-issue { color: var(--issue); }
.mt-cap { margin: 0; font-size: 12px; color: var(--text-3); }

/* Minutes table */
/* position: relative keeps the hidden screen-reader text (.sr) inside the box; without it, that text
   escapes the box and makes the whole page scroll sideways */
.mt-box { position: relative; overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); max-width: 100%; }
.mt { border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; min-width: 100%; }
.mt th, .mt td { border-bottom: 1px solid var(--line-soft); background: var(--surface); }
.mt thead th {
  border-bottom-color: var(--line); padding: 10px 8px; font-family: var(--mono); font-size: 11px; font-weight: 500;
  letter-spacing: 0.08em; color: var(--text-3); white-space: nowrap;
}
.mt .pin {
  position: sticky; left: 0; z-index: 1; text-align: left; border-right: 1px solid var(--line);
  padding: 8px 14px; min-width: 170px; white-space: nowrap; font-weight: 600;
}
.mt thead .pin { z-index: 2; padding: 10px 14px; font-weight: 500; }
.mt .c-pos { padding: 8px; text-align: center; color: var(--text-2); font-family: var(--mono); font-size: 13px; }
.mt .num { padding: 8px; text-align: right; font-family: var(--mono); font-size: 13px; white-space: nowrap; }
.mt td.none { color: var(--text-3); }
.mt thead .avg { color: var(--text); }
.mt td.avg { font-size: 14px; font-weight: 600; }
.mt .l3 { padding-right: 12px; border-right: 1px solid var(--line-strong); }
.mt td.hot { color: var(--c); }
.mrow:hover th, .mrow:hover td { background: var(--row-hover); }

.mt .gh { min-width: 58px; padding: 8px 4px; font-weight: 600; letter-spacing: 0; color: var(--text); }
.gh-in { display: flex; flex-direction: column; align-items: center; gap: 1px; }
.gh-code { display: inline-flex; align-items: center; gap: 3px; }
.gh-icon { display: inline-flex; }
.gh-day { color: var(--text-3); font-weight: 400; }
.mt .gh.gi { background: var(--issue-bg); border-top: 2px dashed var(--issue); }
.gh.gi .gh-code { color: var(--issue); }
.mt td.gi-col { background: var(--issue-column); }

.mt .mcell { padding: 4px 5px; text-align: center; }
.mc {
  display: inline-flex; align-items: center; justify-content: center; gap: 3px; min-width: 44px; min-height: 28px;
  padding: 0 4px; border-radius: 3px; font-family: var(--mono); font-size: 13px; color: var(--text-2);
  white-space: nowrap;
}
.mc.st { color: var(--text); font-weight: 600; }
.mc.dnp { color: var(--text-off); }
.mc-dot { flex: none; width: 5px; height: 5px; border-radius: 50%; background: var(--text); }
.mt-legend .mc-dot { width: 6px; height: 6px; }
.mc.flagged { font-weight: 700; cursor: pointer; font: inherit; font-family: var(--mono); font-size: 13px; font-weight: 700; }
.mc.flagged, .mc.flagged.st { color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent);
  border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); }
.mc.flagged:hover { filter: brightness(1.3); color: var(--c); }
.mc-sym { font-size: 9px; }
.mt-line {
  margin: 0; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  font-size: 13px; color: var(--text-2);
}
.mt-line-what { color: var(--text); }
.mt-line-flag { color: var(--text); }
.mt-line-sym { color: var(--c); font-family: var(--mono); font-weight: 700; }

/* Rotation chart list (the charts themselves: phase 5) */
.rc { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.rc-game + .rc-game { border-top: 1px solid var(--line-soft); }
.rc-btn {
  display: flex; width: 100%; align-items: center; gap: 14px; min-height: 48px; padding: 0 16px; background: none;
  border: 0; color: var(--text); font: inherit; cursor: pointer; text-align: left;
}
.rc-btn:hover { background: var(--row-hover); }
.rc-arrow { font-family: var(--mono); color: var(--text-3); }
.rc-vs { font-weight: 600; min-width: 150px; }
.rc-date { color: var(--text-2); min-width: 56px; }
.rc-res { font-family: var(--mono); }
.rc-body { padding: 12px 16px 16px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.rc-body > .ch { align-self: stretch; }
.rc-more { margin: 8px 0 0; font-size: 12px; color: var(--text-3); }
.rc-full { display: inline-flex; align-items: center; min-height: 32px; color: var(--text-2); font-size: 13px; text-decoration: underline; }

/* Early season empty state (section 5) */
.tempty { border: 1px dashed var(--line-strong); border-radius: 6px; padding: 24px; color: var(--text-2); }
.tempty p { margin: 0; }
.tempty-head { color: var(--text); font-weight: 600; margin-bottom: 4px !important; }

/* Phone (PhoneTeam.dc.html) */
@media (max-width: 599px) {
  .thead { gap: 8px; }
  .thead-main { width: 100%; gap: 8px; }
  .tpick-row { flex-direction: column; align-items: stretch; gap: 8px; }
  .tpick-row label { font-size: 10.5px; }
  .tpick { min-height: 44px; background: var(--surface); font-size: 16px; font-weight: 600; }
  .tline { font-size: 13px; }
  .tchips { gap: 6px; }
  .tchip { font-size: 12.5px; min-height: 28px; padding: 0 8px; }
  .tsec { gap: 8px; }
  .tsec h2 { font-size: 16px; }
  .mt-cap { font-size: 11.5px; }
  .mt thead th { padding: 8px 6px; font-size: 10.5px; letter-spacing: 0; }
  .mt .pin { min-width: 104px; max-width: 128px; padding: 6px 10px; border-right-color: var(--line-strong); }
  .mt thead .pin { padding: 8px 10px; }
  .pin-narrow { display: flex; flex-direction: column; }
  .pin-short { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .pin-sub { font-family: var(--mono); font-size: 10.5px; font-weight: 400; color: var(--text-3); }
  .mt .num { padding: 6px; }
  .mt td.avg { font-size: 13px; }
  .mt .l3 { padding-right: 8px; }
  .mt .gh { min-width: 50px; padding: 6px 3px; font-size: 10.5px; }
  .mt .mcell { padding: 3px; }
  .mc { min-width: 40px; min-height: 30px; font-size: 12.5px; padding: 0 3px; }
  .mc.flagged { font-size: 12.5px; }
  .mc.st { font-weight: 700; }
  .mc .mc-dot { display: none; } /* phone: bold = started (the caption says so) */
  .rc-btn { gap: 10px; padding: 0 12px; min-height: 46px; }
  .rc-vs { min-width: 0; }
  .rc-date { min-width: 0; font-size: 13px; }
  .rc-res { margin-left: auto; font-size: 13px; }
  .rc-body { padding: 4px 12px 12px; }
}

/* Matchup page (specs/06a-redesign-design.md section 4.2; mockups Matchup.dc.html, PhoneMatchup.dc.html).
   Colors are the 06a section 2 tokens (base.css). Only the minutes grid scrolls sideways, inside its
   box (.mbox); the page never does. SZN / L3 / TREND stay pinned at the box's right edge so they are
   in view with any number of games. */
#tab-matchup { display: flex; flex-direction: column; gap: 24px; }

/* Title row */
.mhead { display: flex; flex-direction: column; gap: 6px; }
.mhead h1 { margin: 0; font-size: 28px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.2; }
.msub { margin: 0; color: var(--text-2); }

/* Side-by-side strip (V8) */
.tape {
  display: flex; flex-direction: column; gap: 8px; padding: 14px 20px 16px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px;
}
.tape-names, .tape-row.only-wide {
  display: grid; grid-template-columns: minmax(0, 1fr) 150px minmax(0, 1fr); gap: 0 16px; align-items: center;
}
.tape-names { font-weight: 650; font-size: 15px; }
.tape-names .tl { text-align: right; }
.thead-mid { text-align: center; font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: 0.1em; color: var(--text-3); }
.tape-row.only-wide { min-height: 28px; }
.tape-row .tl { display: flex; align-items: center; justify-content: flex-end; gap: 10px; min-width: 0; }
.tape-row .tr-side { display: flex; align-items: center; gap: 10px; min-width: 0; }
.tape-row .tc { display: flex; flex-direction: column; align-items: center; line-height: 1.2; }
.tlabel { font-size: 12.5px; color: var(--text-2); text-align: center; }
.tgap { font-family: var(--mono); font-size: 10.5px; color: var(--text-3); }
.tgap.big { font-weight: 700; color: var(--ground); background: var(--pace-accent); padding: 0 6px; border-radius: 2px; }
.tnum { display: flex; flex-direction: column; min-width: 64px; font-family: var(--mono); font-size: 14px; font-weight: 500; color: var(--text-2); }
.tl .tnum { text-align: right; align-items: flex-end; }
.tnum.edge { font-weight: 700; color: var(--text); }
.tnote { font-size: 10.5px; font-weight: 400; color: var(--text-3); }
.ttrack { flex: 0 1 220px; height: 10px; display: flex; background: var(--header); border-radius: 2px; }
.ttrack.right { justify-content: flex-end; }
.tbar { height: 100%; border-radius: 2px; }
.tbar.pace { background: var(--pace-3); }
.tbar.pace.edge { background: var(--pace-5); }
.tbar.size { background: var(--size-2); }
.tbar.size.edge { background: var(--size-4); }
.tbar.small { background: transparent; border: 1.5px dashed var(--text-3); box-sizing: border-box; }
.tape-small { margin: 0; font-size: 12px; color: var(--text-3); }

/* Phone strip: text rows, the edge side filled */
.tape-row.only-narrow { display: grid; grid-template-columns: 72px minmax(0, 1fr) 72px; gap: 8px; align-items: center; }
.pv { justify-self: start; font-family: var(--mono); font-size: 13px; padding: 1px 6px; border-radius: 3px; color: var(--text-2); }
.pv.right { justify-self: end; }
.pv.edge { font-weight: 700; }
.pv.pace.edge { background: var(--pace-5); color: var(--ground); }
.pv.size.edge { background: var(--size-3); color: var(--text); }
.pv.small { border: 1px dashed var(--text-3); }
.plabel { font-size: 12px; color: var(--text-2); text-align: center; }
.tape-key { display: grid; grid-template-columns: 72px minmax(0, 1fr) 72px; gap: 8px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; color: var(--text-3); }
.tape-key span:nth-child(2) { text-align: center; }
.tape-key .right { text-align: right; }

/* Team switch (phone only, V14) */
.tswitch {
  position: sticky; top: 0; z-index: 3; display: flex; border: 1px solid var(--line-strong); border-radius: 4px;
  overflow: hidden; background: var(--ground);
}
.tswitch button {
  flex: 1 1 0; min-height: 44px; border: 0; background: transparent; color: var(--text-2); font: inherit;
  font-size: 14px; cursor: pointer;
}
.tswitch button + button { border-left: 1px solid var(--line-strong); }
.tswitch button[aria-pressed="true"] { background: var(--text); color: var(--ground); font-weight: 650; }

/* Team panels */
/* One team above the other at every width (Steffen, Nov 5 2026): a computer screen shows the whole table */
.mpanels { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; align-items: start; }
.mpanel { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.phead-row { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 12px; }
.phead-row h2 { margin: 0; font-size: 18px; font-weight: 650; }
.plast { font-weight: 400; font-size: 13px; color: var(--text-3); }
.mchips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.mchip {
  display: inline-flex; align-items: center; min-height: 28px; font-family: var(--mono); font-size: 12px;
  font-weight: 600; padding: 0 8px; border-radius: 3px;
}
.mchip:hover { color: var(--c); filter: brightness(1.25); }
button.mchip { font: inherit; cursor: pointer; }
.mchip[aria-expanded="true"] { background: color-mix(in srgb, var(--c) 22%, transparent); }
.mchip[aria-expanded="true"]::after { content: " ▴"; }
/* A flag chip's dropdown, in place under the header (Steffen, Nov 5 2026) */
.fpop {
  display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
  border-left: 3px solid var(--c); border-radius: 6px; background: var(--popover); font-size: 13px;
}
.fpop-head { margin: 0; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; color: var(--c); text-transform: uppercase; }
.fpop-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.fpop-list b { font-weight: 650; }
.fpop-more { align-self: flex-start; display: inline-flex; align-items: center; min-height: 32px; color: var(--text-2); font-weight: 600; }
.fpop-more:hover { color: var(--text); }

/* Minutes grid (V6, V7) */
.mbox { position: relative; overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); max-width: 100%; }
.mgrid { border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; min-width: 100%; }
.mgrid th, .mgrid td { border-bottom: 1px solid var(--line-soft); background: var(--surface); }
.mgrid thead th {
  border-bottom-color: var(--line); padding: 8px 6px; font-family: var(--mono); font-size: 10.5px; font-weight: 500;
  letter-spacing: 0.06em; color: var(--text); white-space: nowrap;
}
.mgrid .pin {
  position: sticky; left: 0; z-index: 1; text-align: left; border-right: 1px solid var(--line);
  padding: 5px 10px; min-width: 132px; white-space: nowrap;
}
.mgrid thead .pin { z-index: 2; color: var(--text-3); letter-spacing: 0.08em; }
.pname { font-weight: 600; font-size: 13px; }
.ppos { margin-left: 6px; font-family: var(--mono); font-size: 11px; color: var(--text-3); }
.mgrid .gh { padding: 6px 2px; font-size: 10px; font-weight: 600; letter-spacing: 0.02em; }
.mgrid .gh a, .mgrid .gh .gh-in { display: flex; flex-direction: column; align-items: center; line-height: 1.15; }
.mgrid .gh a { min-height: 32px; justify-content: center; }
.gh-res { color: var(--text-3); font-weight: 400; }
.mgrid .gh.gi { background: var(--issue-bg); }
.mgrid .gh.gi .gh-code { color: var(--issue); }
.hcell { padding: 3px 2px; text-align: center; }
.mrow:hover .hcell, .mrow:hover .pin, .mrow:hover .c-szn, .mrow:hover .c-l3, .mrow:hover .c-trend { background: var(--row-hover); }

.hc {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 1px; width: 38px; height: 26px;
  border-radius: 3px; font-family: var(--mono); font-size: 12px; color: var(--heat-dim-text);
}
.hc.dnp { color: var(--text-off); }
.hc.h1 { background: var(--heat-1); }
.hc.h2 { background: var(--heat-2); }
.hc.h3 { background: var(--heat-3); color: var(--text); }
.hc.h4 { background: var(--heat-4); color: var(--text); font-weight: 600; }
.hc.h5 { background: var(--heat-5); color: var(--text); font-weight: 600; }
.hc.flagged { color: var(--text); font-weight: 700; box-shadow: inset 0 0 0 1.5px var(--c); }
.hc.out {
  color: var(--flag-absent); font-size: 10.5px; font-weight: 700; box-shadow: none;
  background: color-mix(in srgb, var(--flag-absent) 12%, transparent); border: 1px solid color-mix(in srgb, var(--flag-absent) 40%, transparent);
}
.hc.role { outline: 1px dashed var(--flag-new); outline-offset: 1px; }
.hc-sym { font-size: 8.5px; }
.sbar { position: absolute; left: 3px; right: 3px; top: 2px; height: 2px; background: var(--text); border-radius: 1px; }

/* SZN, L3, TREND: pinned at the right edge of the box */
.mgrid .c-szn, .mgrid .c-l3, .mgrid .c-trend { position: sticky; z-index: 1; box-sizing: border-box; }
.mgrid .c-trend { right: 0; width: 80px; min-width: 80px; padding: 4px 10px 4px 6px; text-align: center; }
.mgrid .c-l3 { right: 80px; width: 48px; min-width: 48px; padding: 5px 6px; text-align: right; font-family: var(--mono); font-size: 13px; color: var(--text-2); }
.mgrid .c-szn {
  right: 128px; width: 52px; min-width: 52px; padding: 5px 6px; text-align: right; font-family: var(--mono); font-size: 13px;
  font-weight: 600; border-left: 1px solid var(--line-strong);
}
.mgrid thead .c-szn, .mgrid thead .c-l3 { font-weight: 500; color: var(--text); font-size: 10.5px; }
.mgrid thead .c-szn, .mgrid thead .c-l3, .mgrid thead .c-trend { z-index: 2; }

.tr { display: inline-block; min-width: 60px; font-family: var(--mono); font-size: 12px; padding: 2px 6px; border-radius: 3px; white-space: nowrap; }
.tr.gray, .tr.none { color: var(--text-3); }
.tr.tint { font-weight: 700; }
.tr.tint.up { color: var(--more); background: color-mix(in srgb, var(--more) 12%, transparent); border: 1px solid color-mix(in srgb, var(--more) 35%, transparent); }
.tr.tint.down { color: var(--less); background: color-mix(in srgb, var(--less) 12%, transparent); border: 1px solid color-mix(in srgb, var(--less) 35%, transparent); }
.tr.solid { font-weight: 700; color: var(--ground); }
.tr.solid.up { background: var(--more); }
.tr.solid.down { background: var(--less); }
.tr.out {
  font-size: 11px; font-weight: 700; color: var(--flag-absent);
  background: color-mix(in srgb, var(--flag-absent) 10%, transparent); border: 1px solid color-mix(in srgb, var(--flag-absent) 30%, transparent);
}

/* Under the grid */
.grid-note { margin: -4px 0 0; font-size: 11.5px; color: var(--text-3); }
.grid-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; }
.grid-legend > span { display: inline-flex; align-items: center; gap: 6px; }
.lg-sbar { display: inline-block; width: 14px; height: 2px; background: var(--text); border-radius: 1px; }
.lg-role { display: inline-block; width: 12px; height: 10px; border: 1px dashed var(--flag-new); border-radius: 2px; }
.under { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; }
.under:empty { display: none; }
.absorb { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.absorb b { font-weight: 600; }
.out-chip {
  font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--flag-absent); padding: 1px 6px; border-radius: 3px;
  background: color-mix(in srgb, var(--flag-absent) 10%, transparent); border: 1px solid color-mix(in srgb, var(--flag-absent) 30%, transparent);
}
.absorb-mid { color: var(--text-3); }
.absorb-to { font-family: var(--mono); color: var(--more); }
.fold-btn {
  align-self: flex-start; min-height: 32px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 4px;
  background: transparent; color: var(--text-2); font: inherit; font-size: 12.5px; cursor: pointer;
}
.fold-btn:hover { color: var(--text); border-color: var(--text-3); }
.fold-btn[aria-expanded="true"]::before { content: "▴ "; }
.fold-btn[aria-expanded="false"]::before { content: "▾ "; }
.mnote { margin: 0; color: var(--issue-text); }
/* Data issue notes: a drawer, closed by default; its header is the marker (project rule 4) */
.issue-drawer { border: 1px solid var(--issue-line); border-radius: 6px; background: var(--issue-bg); }
.issue-drawer summary {
  display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 12px; cursor: pointer; list-style: none;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; color: var(--issue);
}
.issue-drawer summary::-webkit-details-marker { display: none; }
.issue-drawer summary::after { content: "▾"; margin-left: auto; }
.issue-drawer[open] summary::after { content: "▴"; }
.issue-drawer .mnote { padding: 0 12px 10px; }
.issue-drawer:not([open]) .mnote { display: none; }
/* Game-by-game charts: one large button per team, near the top (Steffen, Nov 5 2026) */
.games-btns { display: flex; flex-wrap: wrap; gap: 12px; }
.bwrap { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.games-link {
  display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 22px;
  border: 1px solid var(--line-heavy); border-radius: 8px; background: var(--surface-2); font-weight: 650; font-size: 16px;
}
.games-link:hover { border-color: var(--text-3); background: var(--row-hover); }

/* Phone (V14): one team at a time, 30 x 24 cells, the newest games in view */
@media (max-width: 599px) {
  #tab-matchup { gap: 14px; }
  .mhead h1 { font-size: 22px; }
  .msub { font-family: var(--mono); font-size: 12px; }
  .tape { padding: 10px 12px; gap: 6px; }
  .mpanel:not(.on) { display: none; }
  .mgrid .pin { min-width: 0; width: 92px; max-width: 92px; padding: 4px 8px; overflow: hidden; text-overflow: ellipsis; }
  .mgrid .pin .pname { display: block; overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; }
  .hcell { padding: 3px 1px; }
  .hc { width: 30px; height: 24px; font-size: 11.5px; }
  .hc.out { font-size: 9.5px; }
  .mgrid .gh { padding: 0 1px; font-size: 9.5px; }
  /* 06a §12: 44 px taps on the phone */
  .mgrid .gh a, .mchip, .fold-btn { min-height: 44px; }
  .mgrid .c-trend { width: 62px; min-width: 62px; padding: 3px 6px 3px 4px; }
  .mgrid .c-szn { right: 62px; width: 44px; min-width: 44px; padding: 4px; font-size: 12px; }
  .tr { min-width: 50px; font-size: 11px; padding: 1px 4px; text-align: center; }
  .games-btns { flex-direction: column; gap: 8px; }
  .games-link { min-height: 48px; font-size: 15px; }
  .bwrap:not(.on) { display: none; }
  .issue-drawer summary { min-height: 44px; }
}

/* ---------- Phase S3: Minutes | Situations switch (V5), Situations view, foul trouble (D),
   reacting to the opponent (E) and its evidence lists (V17) ---------- */
.mhead { flex-direction: row; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 16px; }
.mhead-text { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.vswitch { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 4px; overflow: hidden; }
.vswitch button {
  min-height: 40px; padding: 0 16px; border: 0; background: transparent; color: var(--text-2); font: inherit; font-size: 13px; cursor: pointer;
}
.vswitch button + button { border-left: 1px solid var(--line-strong); }
.vswitch button[aria-pressed="true"] { background: var(--text); color: var(--ground); font-weight: 600; }

/* Situations table */
.sgrid .sh { padding: 8px; text-align: center; line-height: 1.2; }
.sgrid .sh-a, .sgrid .sh-b { display: block; }
.sgrid .sh-b { color: var(--text-3); }
/* 06a V5: both teams' six columns fit side by side on a 1440 laptop: headers wrap, RAMP-UP takes two lines */
.sgrid thead th.sh { white-space: normal; padding: 8px 3px; }
.scell { padding: 4px 3px; text-align: center; white-space: nowrap; }
.sgrid .scell:last-child { white-space: normal; }
.sv.ramp { display: inline-block; max-width: 84px; line-height: 1.25; }
.rsmall { margin: 6px 0 0; font-size: 12px; color: var(--text-3); }
.srow:hover .scell, .srow:hover .pin { background: var(--row-hover); }
.sv {
  display: inline-flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 12.5px; padding: 2px 6px;
  border-radius: 3px; border: 1px solid transparent;
}
.sv.none { color: var(--text-off); }
.sv.heat { min-width: 40px; justify-content: center; color: var(--text-off); }
.sv.heat.h1 { background: var(--heat-1); color: var(--heat-dim-text); }
.sv.heat.h2 { background: var(--heat-2); color: var(--heat-dim-text); }
.sv.heat.h3 { background: var(--heat-3); color: var(--text); }
.sv.heat.h4 { background: var(--heat-4); color: var(--text); font-weight: 600; }
.sv.heat.h5 { background: var(--heat-5); color: var(--text); font-weight: 600; }
.sv.small, .cb .small { border: 1px dashed var(--text-3); color: var(--text-2); }
.stl-s { color: var(--text-2); }
.stl-a, .cb-bar { color: var(--text-off); }
.stl .tr { min-width: 38px; }
.cb-c, .cb-b { padding: 1px 4px; border-radius: 3px; border: 1px solid transparent; }
.cb-b { color: var(--text-2); }
.cb-b.k-more { font-weight: 700; color: var(--more); background: color-mix(in srgb, var(--more) 12%, transparent); }
.cb-b.k-less { font-weight: 700; color: var(--less); background: color-mix(in srgb, var(--less) 12%, transparent); }
.flbar { width: 44px; height: 8px; background: var(--header); border-radius: 2px; display: flex; }
.flbar .flfill { height: 100%; border-radius: 2px; }
.flfill.f1 { background: var(--foul-1); }
.flfill.f2 { background: var(--foul-2); }
.flfill.f3 { background: var(--foul-3); }
.fnum { color: var(--text-2); font-size: 12px; }
.sv.ramp { color: var(--text); border-color: var(--line-strong); font-size: 12px; }
.sv.ramp.small { border-style: dashed; color: var(--text-2); }
.lg-small { display: inline-block; width: 14px; height: 10px; border: 1px dashed var(--text-3); border-radius: 2px; }

/* Foul trouble and reacting blocks */
.dsec { display: flex; flex-direction: column; gap: 12px; }
.dsec h2 { margin: 0; font-size: 17px; font-weight: 650; }
.hnote { font-weight: 400; font-size: 13px; color: var(--text-3); }
.blocks { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(600px, 100%), 1fr)); gap: 20px; align-items: start; }
.fblock, .rblock { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
.fblock { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.fblock h3, .rblock h3 { margin: 0; font-size: 14px; font-weight: 650; }
.rblock h3 { padding: 12px 16px; border-bottom: 1px solid var(--line); }
.bnote { font-weight: 400; font-size: 12px; color: var(--text-3); }
.dfrow { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 4px 14px; align-items: center; }
.rlab { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.rl { font-size: 13px; font-weight: 600; }
.rs { font-size: 11.5px; color: var(--text-3); }
.fright { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.dfline { display: flex; align-items: center; gap: 10px; }
.sbox { position: relative; flex: 1 1 0; min-width: 40px; background: var(--header); border: 1px solid var(--line); border-radius: 2px; }
.sbox.fbox { height: 14px; }
.sbox.rbox { flex: none; height: 12px; display: block; }
.sfill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 1px; background: var(--on-floor); }
.sfill.k-more { background: var(--more); }
.sfill.k-less { background: var(--less); }
.sfill.small { background: transparent; border: 1.5px dashed var(--on-floor); box-sizing: border-box; }
.sfill.small.k-more { border-color: var(--more); }
.sfill.small.k-less { border-color: var(--less); }
.sref { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--text); }
.spill, .rhead {
  display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-width: 92px; font-family: var(--mono);
  font-size: 12px; font-weight: 600; color: var(--text); border: 1px solid var(--line-strong); padding: 2px 6px;
  border-radius: 3px; white-space: nowrap;
}
.spill.k-more, .rhead.k-more {
  font-weight: 700; color: var(--more); background: color-mix(in srgb, var(--more) 12%, transparent);
  border-color: color-mix(in srgb, var(--more) 35%, transparent);
}
.spill.k-less, .rhead.k-less {
  font-weight: 700; color: var(--less); background: color-mix(in srgb, var(--less) 12%, transparent);
  border-color: color-mix(in srgb, var(--less) 35%, transparent);
}
.spill.small, .rhead.small { font-weight: 400; color: var(--text-2); border: 1px dashed var(--text-3); background: none; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-family: var(--mono); font-size: 12px; color: var(--text-2); }
.fsplit {
  display: grid; grid-template-columns: 150px repeat(2, minmax(0, 1fr)); gap: 6px 14px; padding-top: 10px;
  border-top: 1px solid var(--line-soft); font-size: 12.5px; align-items: center;
}
.fsh { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; color: var(--text-3); }
.fwho { font-weight: 600; }
.fcell { font-family: var(--mono); font-size: 12.5px; justify-self: start; }
.fcell.small { color: var(--text-2); border: 1px dashed var(--text-3); padding: 1px 6px; border-radius: 3px; }
.rwrap { display: flex; flex-direction: column; border-bottom: 1px solid var(--line-soft); }
.rwrap:last-child { border-bottom: 0; }
.rrow {
  display: grid; grid-template-columns: 170px minmax(0, 1fr) 96px; gap: 0 14px; align-items: center; width: 100%;
  min-height: 52px; padding: 10px 16px; background: none; border: 0; color: var(--text); font: inherit; text-align: left; cursor: pointer;
}
.rrow:hover { background: var(--row-hover); }
.rmid { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.rtxt { font-family: var(--mono); font-size: 12px; color: var(--text-2); }
.rhead { min-width: 0; min-height: 36px; font-size: 12.5px; font-weight: 700; }
.rrow[aria-expanded="true"] .rhead { background-color: var(--surface-2); border-color: var(--text-3); }
.rrow[aria-expanded="false"] .caret::after { content: "▾"; font-size: 10px; }
.rrow[aria-expanded="true"] .caret::after { content: "▴"; font-size: 10px; }
.evlist { margin: 0 16px 12px; background: var(--header); border: 1px solid var(--line-strong); border-radius: 4px; overflow: hidden; }
.evhead, .evrow { display: grid; grid-template-columns: 96px 78px minmax(0, 1fr) 150px; gap: 0 12px; align-items: center; padding: 0 12px; }
.evhead { padding: 7px 12px; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; color: var(--text-3); border-bottom: 1px solid var(--line); }
.evrow { min-height: 32px; border-bottom: 1px solid var(--line-soft); font-size: 12.5px; color: var(--text); }
a.evrow:hover { background: var(--row-hover); }
.evrow.empty { display: flex; color: var(--text-3); }
.evg { font-family: var(--mono); }
.evc { font-family: var(--mono); color: var(--text-2); }
.eva { font-family: var(--mono); font-size: 12px; color: var(--text-3); }
.eva.good { color: var(--text); }
.evmore { padding: 7px 12px; font-size: 12px; color: var(--text-3); }

/* Phone: the switch sits above the grid, full width; one team's blocks at a time */
@media (max-width: 599px) {
  .vswitch.only-narrow { display: flex; }
  .vswitch.only-narrow button { flex: 1 1 0; min-height: 44px; }
  .fblock:not(.on), .rblock:not(.on) { display: none; }
  .fblock { padding: 12px; gap: 10px; }
  .dfrow { grid-template-columns: minmax(0, 1fr); }
  .fsplit { grid-template-columns: minmax(0, 1.2fr) repeat(2, minmax(0, 1fr)); gap: 6px 8px; font-size: 12px; }
  .fcell { white-space: normal; }
  .spill { min-width: 0; }
  .rrow { grid-template-columns: minmax(0, 1fr) 76px; gap: 4px 10px; padding: 8px 12px; }
  .rmid .rbox { display: none; }
  .rlab .rs { display: none; }
  .rmid { grid-column: 1; grid-row: 2; }
  .rhead { grid-column: 2; grid-row: 1 / span 2; }
  .evlist { margin: 0 12px 10px; }
  .evrow {
    grid-template-columns: auto auto minmax(0, 1fr); grid-template-areas: "g c a" "w w w"; min-height: 44px;
    padding: 4px 10px; gap: 1px 8px; font-size: 12px;
  }
  .evg { grid-area: g; }
  .evc { grid-area: c; }
  .eva { grid-area: a; justify-self: end; text-align: right; }
  .evw { grid-area: w; color: var(--text-2); }
}

/* Rotation charts (specs/04a-report-design.md sections 4.4 and 6). Sizes from the mockups:
   full = Chart.dc.html / ChartIssue.dc.html, compact = Team.dc.html, phone = PhoneChart.dc.html.
   Every row is a 3-column grid: name, timeline, minutes. Below 600 px name and minutes sit above the bar. */
.ch {
  --nw: 210px; --mw: 52px; --cg: 14px; --rowh: 40px; --barh: 26px; --pl: 7px;
  display: flex; flex-direction: column; gap: 4px; min-width: 0; overflow-x: clip; font-variant-numeric: tabular-nums;
}
.ch-full.ch-issue { --mw: 76px; --rowh: 38px; --barh: 24px; }
.ch-compact { --nw: 180px; --mw: 44px; --cg: 12px; --rowh: 30px; --barh: 18px; --pl: 6px; gap: 2px; }
.ch-none { margin: 0; color: var(--text-3); font-size: 13px; }
.ch-g { display: grid; grid-template-columns: var(--nw) minmax(0, 1fr) var(--mw); column-gap: var(--cg); align-items: center; }
.ch-n { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ch-m { text-align: right; font-family: var(--mono); }
.ch-t { position: relative; display: block; min-width: 0; }

/* Period labels (full) */
.ch-periods { align-items: end; margin-bottom: 4px; }
.ch-periods .ch-t { height: 22px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; }
.ch-per { position: absolute; bottom: 4px; text-align: center; color: var(--text-2); white-space: nowrap; overflow: hidden; }
.ch-per.ot { color: var(--text); font-weight: 700; }
.ch-periods .ch-m { font-size: 11px; color: var(--text-3); letter-spacing: 0.06em; }

/* Score margin (section 6.2) */
.ch-mrow { margin-bottom: 10px; }
.ch-compact .ch-mrow { margin-bottom: 4px; }
.ch-mrow .ch-n { flex-direction: column; align-items: flex-start; gap: 0; }
.ch-mlab { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; color: var(--text-2); }
.ch-compact .ch-mlab { color: var(--text-3); letter-spacing: 0.06em; }
.ch-mwords { font-size: 12px; color: var(--text-3); }
.ch-mbox { position: relative; display: block; height: 56px; }
.ch-compact .ch-mbox { height: 44px; }
.ch-msvg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ch-msvg line, .ch-msvg polyline { vector-effect: non-scaling-stroke; stroke-width: 1; }
.m-bg { fill: var(--header); }
.m-ot { fill: var(--ot-band); }
.m-zero { stroke: var(--bench-bar); }
.m-half { stroke: var(--period-line); stroke-dasharray: 3 3; }
.m-otl { stroke: var(--period-line); }
.m-blow { stroke: var(--tag-blowout); stroke-opacity: 0.5; stroke-dasharray: 2 4; }
.ch-msvg .m-line { fill: none; stroke: var(--starter-badge); stroke-width: 1.5; }
.ch-scale { position: absolute; left: 4px; font-family: var(--mono); font-size: 10px; color: var(--text-3); line-height: 1.2; }
.ch-scale.hi { top: 0; }
.ch-scale.lo { bottom: 0; }
.ch-blowlab { position: absolute; right: 4px; top: 2px; font-family: var(--mono); font-size: 10px; color: var(--tag-blowout); line-height: 1.2; background: var(--header); padding: 0 3px; }
.ch-blowlab.low { top: auto; bottom: 2px; }
.ch-final { font-size: 13px; color: var(--text-2); }
.ch-compact .ch-final { font-size: 11px; color: var(--text-3); }

/* Player rows (section 6.3) */
.ch-rows { position: relative; display: flex; flex-direction: column; }
.ch-row { min-height: var(--rowh); border-top: 1px solid var(--line-soft); }
.ch-compact .ch-row { border-top: 0; }
.ch-badge {
  flex: none; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 10.5px; font-weight: 700; border-radius: 2px; border: 1px solid var(--line-strong);
}
.ch-badge.st { color: var(--ground); background: var(--starter-badge); border-color: var(--starter-badge); }
.ch-compact .ch-badge { width: 16px; height: 16px; font-size: 10px; }
.ch-who { display: flex; flex-direction: column; min-width: 0; }
.ch-name { position: relative; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ch-compact .ch-name { font-size: 13px; font-weight: 400; }
.ch-line { font-size: 11.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ch-mins { position: relative; display: flex; justify-content: flex-end; align-items: baseline; gap: 6px; font-family: var(--mono); font-size: 14px; font-weight: 600; }
.ch-compact .ch-mins { font-size: 13px; font-weight: 400; }
.ch-sub { font-size: 11px; font-weight: 400; color: var(--issue); }
.ch-track { position: relative; display: block; height: var(--barh); background: var(--header); border-radius: 2px; }
.ch-ot { position: absolute; top: 0; bottom: 0; background: var(--ot-band); }
.ch-pl { position: absolute; top: calc(-1 * var(--pl)); bottom: calc(-1 * var(--pl)); border-left: 1px solid var(--period-line); pointer-events: none; }
.ch-pl.half { border-left-style: dashed; }
.ch-bar { position: absolute; top: 4px; bottom: 4px; background: var(--on-floor); border-radius: 1px; }
.ch-compact .ch-bar { top: 3px; bottom: 3px; }
.ch-endcap { border-right: 3px solid var(--tag-end); box-sizing: border-box; } /* the cap stays inside the bar's width */

/* Gaps and their tags (section 6.4) */
.t-fo { --tc: var(--tag-fouled-out); }
.t-ft { --tc: var(--tag-foul-trouble); }
.t-inj { --tc: var(--tag-injury); }
.t-bl { --tc: var(--tag-blowout); }
.ch-gap { position: absolute; top: 0; bottom: 0; z-index: 2; padding: 0; border: 0; background: transparent; cursor: pointer; }
.ch-gap:hover { background: color-mix(in srgb, var(--text) 8%, transparent); }
.ch-gap.sel { background: color-mix(in srgb, var(--text) 10%, transparent); outline: 1px solid var(--text); outline-offset: -1px; }
.ch-gap:focus-visible { outline: 2px solid var(--text); outline-offset: 0; z-index: 4; }
.ch-cap { position: absolute; top: 2px; bottom: 2px; width: 3px; z-index: 1; background: var(--tc); pointer-events: none; }
.ch-tick { position: absolute; top: 7px; bottom: 7px; width: 2px; margin-left: 1px; background: var(--tag-none); pointer-events: none; }
.ch-compact .ch-tick { top: 4px; bottom: 4px; }
.ch-chip {
  position: absolute; top: 5px; z-index: 1; height: 16px; display: flex; align-items: center; padding: 0 4px;
  font-family: var(--mono); font-size: 10.5px; font-weight: 700; color: var(--ground); background: var(--tc);
  border-radius: 2px; white-space: nowrap; pointer-events: none;
}
.ch-full.ch-issue .ch-chip { top: 4px; }
.ch-compact .ch-chip { top: 1px; }
.ch-chip-off { visibility: hidden; } /* would sit on another mark or chip (charts.js hideClashes) */

/* Data issue: not 5 on the floor (section 6.6) */
.ch-bandrow .ch-t { height: 20px; }
.ch-bandlab {
  position: absolute; bottom: 2px; white-space: nowrap; font-family: var(--mono); font-size: 10.5px; font-weight: 700;
  letter-spacing: 0.06em; color: var(--ground); background: var(--issue); padding: 1px 6px; border-radius: 2px;
}
.ch-over { position: absolute; top: 0; bottom: 0; left: calc(var(--nw) + var(--cg)); right: calc(var(--mw) + var(--cg)); z-index: 3; pointer-events: none; }
.ch-band {
  position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--issue); border-right: 1px solid var(--issue);
  background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--issue) 30%, transparent) 0 2px, transparent 2px 7px);
}

/* Bottom axis */
.ch-axis { margin-top: 6px; }
.ch-axis .ch-t { height: 18px; font-family: var(--mono); font-size: 11px; color: var(--text-3); }
.ch-tk { position: absolute; top: 0; white-space: nowrap; }
.ch-tk.half { color: var(--text-2); }
.ch-axis .ch-m { font-size: 11px; color: var(--text-3); }
.ch-axis .issue { color: var(--issue); }
.ch-exits { margin: 6px 0 0; font-size: 12px; color: var(--text-3); }

/* Evidence popover (sections 5 and 6.5); a bottom sheet on the phone */
.ch-pop {
  position: absolute; left: var(--px, 0); top: var(--py, 0); z-index: 6; width: 340px; max-width: 100%;
  display: flex; flex-direction: column; gap: 8px; padding: 12px 14px 14px; background: var(--popover);
  border: 1px solid var(--line-heavy); border-radius: 6px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
}
.ch-pop-grab { display: none; }
.ch-pop-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.ch-pop-tag { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: 0.08em; padding: 2px 8px; border-radius: 3px; }
.ch-pop-tag.loud { color: var(--ground); background: var(--tc); }
.ch-pop-tag.quiet { color: var(--text-2); border: 1px solid var(--line-heavy); }
.ch-pop-x { flex: none; width: 32px; height: 32px; background: none; border: 0; color: var(--text-2); font: inherit; font-size: 18px; cursor: pointer; }
.ch-pop-x:hover { color: var(--text); }
.ch-pop-when { margin: 0; font-size: 13px; }
.ch-pop-when b { font-family: var(--mono); }
.ch-pop-ev {
  display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; background: var(--ground);
  border: 1px solid var(--line); border-radius: 4px; font-size: 13px;
}
.ch-pop-lab { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; color: var(--text-3); }
.ch-pop-l1 { font-family: var(--mono); }
.ch-pop-l2 { color: var(--text-2); }

/* The close-up page (section 4.4) */
.cz-back { font-size: 13px; color: var(--text-2); align-self: flex-start; }
.cz-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 32px; }
.cz-title { display: flex; flex-direction: column; gap: 6px; }
.cz-title h1 { margin: 0; font-size: 28px; font-weight: 650; letter-spacing: -0.01em; }
.cz-meta { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; color: var(--text-2); }
.cz-final { font-family: var(--mono); color: var(--text); }
.cz-len { font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.08em; color: var(--text-2); border: 1px solid var(--line-strong); padding: 1px 7px; border-radius: 3px; }
.cz-len.ot { color: var(--text); border-color: var(--line-heavy); }
.cz-ok { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ok); }
.cz-banner {
  display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px 24px; padding: 14px 18px;
  background: var(--issue-bg); border: 1px solid var(--issue-line); border-radius: 6px;
}
.cz-banner-lab { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: var(--issue); }
.cz-banner-body { display: flex; flex-direction: column; gap: 4px; flex: 1 1 520px; min-width: 0; }
.cz-bh { font-size: 15px; font-weight: 600; color: var(--issue-head); }
.cz-bd { font-size: 13px; color: var(--issue-text); }
.cz-bf { font-size: 13px; color: var(--text-2); }
.cz-card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 18px 20px 20px; }
.cz-card.issue { border-color: var(--issue-line); }
.cz-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; font-size: 12.5px; color: var(--text-2); }
.cz-legend > span { display: flex; align-items: center; gap: 6px; }
.lg-on { width: 28px; height: 12px; background: var(--on-floor); border-radius: 1px; }
.lg-chip { font-family: var(--mono); font-size: 10.5px; font-weight: 700; color: var(--ground); background: var(--tc); padding: 0 4px; border-radius: 2px; }
.lg-tick { width: 3px; height: 14px; background: var(--tag-none); }
.lg-end { width: 18px; height: 12px; background: var(--on-floor); border-right: 3px solid var(--tag-end); }
.lg-ot { width: 18px; height: 12px; background: var(--ot-band); border: 1px solid var(--period-line); }
.lg-band {
  width: 18px; height: 12px; border-left: 1px solid var(--issue); border-right: 1px solid var(--issue);
  background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--issue) 30%, transparent) 0 2px, transparent 2px 7px);
}

/* Phone (PhoneChart.dc.html, PhoneTeam.dc.html) */
@media (max-width: 599px) {
  .ch { --nw: 0px; --mw: 0px; --cg: 0px; --pl: 0px; }
  .ch-g { grid-template-columns: minmax(0, 1fr) auto; column-gap: 8px; }
  .ch-g > .ch-n { grid-column: 1; grid-row: 1; }
  .ch-g > .ch-m, .ch-g > .ch-mins { grid-column: 2; grid-row: 1; }
  .ch-g > .ch-t { grid-column: 1 / -1; grid-row: 2; }
  .ch-row { min-height: 0; padding-top: 6px; row-gap: 3px; }
  .ch-compact .ch-row { padding-top: 4px; }
  .ch-compact { --barh: 14px; }
  .ch-compact .ch-chip { display: none; } /* 14 px bars: the 3 px edge only (A3) */
  .ch-line, .ch-plus, .tk-minor, .chip-wide, .ch-scale, .ch-periods .ch-m, .ch-axis .ch-m { display: none; }
  .ch-badge { width: 15px; height: 15px; font-size: 9.5px; }
  .ch-name, .ch-compact .ch-name { font-size: 13px; font-weight: 600; }
  .ch-mins, .ch-compact .ch-mins { font-size: 13px; font-weight: 600; }
  .ch-periods .ch-t { height: 18px; font-size: 10px; letter-spacing: 0.06em; }
  .ch-mrow .ch-n { flex-direction: row; flex-wrap: wrap; gap: 0 8px; }
  .ch-mlab, .ch-mwords { font-size: 10px; }
  .ch-mbox, .ch-compact .ch-mbox { height: 40px; }
  .ch-endcap { border-right-width: 2px; }
  .ch-axis .ch-t { font-size: 10px; }
  .ch-over { left: 0; right: 0; }
  .ch-pop {
    position: fixed; left: 0; right: 0; top: auto; bottom: 0; z-index: 50; width: auto; max-width: none;
    max-height: 80vh; overflow-y: auto; gap: 10px; padding: 10px 16px 24px; border-width: 1px 0 0;
    border-radius: 12px 12px 0 0; box-shadow: 0 -12px 32px rgba(0, 0, 0, 0.6);
  }
  .ch-pop-grab { display: block; align-self: center; width: 40px; height: 4px; border-radius: 2px; background: var(--line-heavy); }
  .ch-pop-x { width: 44px; height: 44px; font-size: 20px; }
  .ch-pop-when { font-size: 14px; }
  .rc-full { min-height: 44px; }
  .cz-head { gap: 10px; }
  .cz-banner { padding: 12px 14px; gap: 8px; }
  .cz-card { padding: 12px; }
  .cz-legend { gap: 8px 14px; font-size: 11.5px; }
}

/* ---------- The game-by-game page (06a §4.3, §6.7-6.12; phase S4; Game.dc.html, PhoneGame.dc.html) ----------
   Rows are 4 columns: name 200 | track | MIN 44 | +/− 48. Phone (V13): 74 | track | MIN 30. */
.ch-game { --nw: 200px; --mw: 44px; --pw: 48px; --cg: 12px; --rowh: 36px; --barh: 24px; --pl: 6px; --bi: 3px; }
.ch-game .ch-g { grid-template-columns: var(--nw) minmax(0, 1fr) var(--mw) var(--pw); }
.ch-p { text-align: right; font-family: var(--mono); }
.ch-periods .ch-p { font-size: 10.5px; color: var(--text-3); }
.ch-body { position: relative; display: flex; flex-direction: column; }
.ch-sec, .ch-secbody { display: flex; flex-direction: column; }
.ch-shw { padding: 6px 0 4px; }
.ch-shw .ch-n { align-items: baseline; flex-wrap: wrap; gap: 0 8px; }
.ch-sname { font-size: 15px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.ch-role { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; color: var(--text-3); }
.ch-exitline { font-size: 12px; color: var(--text-3); }
.ch-fold {
  display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px; padding: 0 2px; background: none; border: 0;
  color: var(--text); font: inherit; text-align: left; cursor: pointer;
}
.ch-fname { font-weight: 650; }
.ch-fsp { flex: 1 1 0; }
.ch-caret, .ch-fmin { font-family: var(--mono); font-size: 10px; color: var(--text-3); }
.ch-caret { font-size: 13px; }
.ch-fold .ch-role { font-size: 10px; }

/* Size and pace strips (§6.9, §6.10; §3 rows 9, 11, 18) */
.ch-strip { min-height: 26px; }
.ch-strip .ch-n { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; color: var(--text-2); }
.ch-strip .ch-m { font-size: 11px; color: var(--text-3); }
.ch-stripbox { position: relative; display: block; height: 20px; background: var(--header); border-radius: 2px; }
.ch-seg {
  position: absolute; top: 1px; bottom: 1px; display: flex; align-items: center; justify-content: center; overflow: hidden;
  font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--text); background: var(--chip, var(--size-0)); border-radius: 1px;
}
.ch-seg.pace-1, .ch-seg.pace-2, .ch-seg.pace-3, .ch-seg.pace-4 { font-size: 10.5px; font-weight: 600; }
.ch-seg.pace-5, .sp-pace.pace-5 { color: var(--ground); font-size: 10.5px; font-weight: 600; }
.sz-0 { --chip: var(--size-0); }
.sz-1 { --chip: var(--size-1); }
.sz-2 { --chip: var(--size-2); }
.sz-3 { --chip: var(--size-3); }
.ch-seg.sz-4 { --chip: var(--size-4); color: var(--ground); }
.ch-seg.sz-5 { --chip: var(--size-5); color: var(--ground); }
.pc-none { --chip: var(--size-0); color: var(--text-3); }
.ch-strip-none .ch-t { font-size: 12px; color: var(--text-3); }

/* The margin seam (V9, §6.8) */
.ch-seam { padding: 10px 0; margin: 6px 0; border-top: 1px solid var(--line-strong); border-bottom: 1px solid var(--line-strong); }
.ch-seam .ch-n { line-height: 1.3; }
.ch-seam .ch-mbox { height: 64px; }
.ch-mkey, .ch-mline { font-size: 12px; color: var(--text-3); }
.m-up { fill: var(--more); fill-opacity: 0.05; }
.m-down { fill: var(--less); fill-opacity: 0.05; }
.ch-seam .ch-scale { font-size: 9.5px; } /* "+12 UTAH": kept small so it covers little of the line */
.ch-seam .ch-scale.hi { color: var(--more); }
.ch-seam .ch-scale.lo { color: var(--less); }
.ch-final.more { color: var(--more); }
.ch-final.less { color: var(--less); }

/* Player rows: bars are buttons colored by the switch (V11, §6.11) */
.ch-game .ch-row { min-height: var(--rowh); }
.ch-game .ch-name { font-size: 13.5px; }
.ch-game .ch-line { font-size: 11px; }
.ch-game .ch-row > .ch-m { position: relative; display: flex; justify-content: flex-end; align-items: baseline; gap: 6px; font-size: 13.5px; font-weight: 600; }
.ch-gpm { font-size: 12.5px; font-weight: 700; color: var(--text-2); }
.ch-gpm.more { color: var(--more); }
.ch-gpm.less { color: var(--less); }
.ch-game .ch-bar {
  top: 0; bottom: 0; padding: var(--bi) 0; border: 0; border-radius: 2px; background-clip: content-box; cursor: pointer;
  display: flex; align-items: center; justify-content: center; overflow: hidden; white-space: nowrap;
  font-family: var(--mono); font-size: 10.5px; font-weight: 700; color: var(--text);
}
.ch-game .ch-bar.ch-endcap::after { content: ""; position: absolute; right: 0; top: var(--bi); bottom: var(--bi); width: 3px; background: var(--tag-end); }
.ch-game .ch-bar:hover { filter: brightness(1.25); }
